<link rel="icon" type="image/png" href="../img/logo-retec.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mesmo visual do Controle de Destinação: barra fixa no topo (unidade + abas), conteúdo em painéis */
:root{
  --bg:#f5f7f5; --surface:#ffffff; --sunken:#edf1ee; --line:#d8dfda; --line-soft:#e6ebe7;
  --ink:#14211b; --ink-2:#4b5a52; --ink-3:#77857d;
  --accent:#1d6b52; --accent-ink:#ffffff; --accent-soft:#dcefe6; --plate:transparent; --plate-pad:0px;
  --s-dest:#2a78d6; --s-loc:#eb6834; --s-rec:#1baf7a;
  --warn:#a86400; --warn-bg:#fff3dc; --crit:#b42f2f; --crit-bg:#fde8e6; --ok:#1d7a3e; --ok-bg:#e2f4e7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --sunken:#1c2621; --line:#2c3a33; --line-soft:#233029;
  --ink:#e9efeb; --ink-2:#b2c0b8; --ink-3:#83938a;
  --accent:#4fb08c; --accent-ink:#06130d; --accent-soft:#1d3a2f; --plate:#eef3f0; --plate-pad:6px 10px;
  --s-dest:#3987e5; --s-loc:#d95926; --s-rec:#199e70;
  --warn:#e8a43a; --warn-bg:#33270f; --crit:#f07b74; --crit-bg:#3a1a19; --ok:#5cc47f; --ok-bg:#15301f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --sunken:#1c2621; --line:#2c3a33; --line-soft:#233029;
  --ink:#e9efeb; --ink-2:#b2c0b8; --ink-3:#83938a;
  --accent:#4fb08c; --accent-ink:#06130d; --accent-soft:#1d3a2f; --plate:#eef3f0; --plate-pad:6px 10px;
  --s-dest:#3987e5; --s-loc:#d95926; --s-rec:#199e70;
  --warn:#e8a43a; --warn-bg:#33270f; --crit:#f07b74; --crit-bg:#3a1a19; --ok:#5cc47f; --ok-bg:#15301f;
  color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px 0}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.brand-row{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.logos{display:flex;align-items:center;gap:10px;background:var(--plate);padding:var(--plate-pad);border-radius:6px;flex-shrink:0}
.logos img{display:block;width:auto}
.logos .l-retec{height:30px}.logos .l-gvc{height:34px}
.logos i{width:1px;align-self:stretch;background:var(--line);margin:2px 0}
.brand-row .brand{margin-right:0;padding-left:14px;border-left:1px solid var(--line)}
.login-logos{display:flex;justify-content:center;align-items:center;gap:22px;margin:28px auto 0;width:max-content;max-width:100%}
.login-logos .l-retec{height:48px}.login-logos .l-gvc{height:56px}
.login-logos i{height:44px}
@media (max-width:560px){.logos .l-retec{height:24px}.logos .l-gvc{height:27px}.brand-row{gap:10px}.brand-row .brand{padding-left:10px}.brand b{font-size:19px}.login-logos .l-retec{height:38px}.login-logos .l-gvc{height:44px}}
.month{display:flex;align-items:center;gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.month button{border:0;background:transparent;color:var(--ink-2);width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:16px}
.month button:hover{background:var(--surface);color:var(--ink)}
.month .lbl{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:16px;min-width:150px;text-align:center}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.on i{background:var(--ok)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;color:var(--ink-2);font:600 14px var(--f-body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .ct{font:500 11px var(--f-mono);background:var(--sunken);border-radius:10px;padding:1px 6px;margin-left:6px;color:var(--ink-2)}
nav.tabs button .ct.alert{background:var(--warn-bg);color:var(--warn)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:17px;margin:0;letter-spacing:.005em}
.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .k i{width:9px;height:9px;border-radius:2px;display:inline-block}
.kpi .v{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kpi.net{background:var(--sunken)}
.delta{font:500 11.5px var(--f-mono);padding:1px 5px;border-radius:3px}
.delta.up{background:var(--crit-bg);color:var(--crit)} .delta.dn{background:var(--ok-bg);color:var(--ok)}
.delta.rup{background:var(--ok-bg);color:var(--ok)} .delta.rdn{background:var(--crit-bg);color:var(--crit)}
/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;align-items:center;gap:10px;font-size:13px;cursor:default}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar .t{height:14px;background:var(--line-soft);border-radius:0 4px 4px 0;position:relative}
.bar .t span{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.bar .val{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:86px}
.bar:hover .n{color:var(--ink)}
.empty{color:var(--ink-3);font-size:13px;padding:14px 0}
/* trend */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--ink-3);font:11px var(--f-body)}
.chart-box{overflow-x:auto}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;background:var(--sunken);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--f-mono);font-size:12.5px}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--accent-soft)}
tfoot td{font-weight:600;background:var(--sunken);border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap}
.pill.custo{background:color-mix(in srgb,var(--s-dest) 15%,transparent);color:var(--s-dest)}
.pill.receita{background:color-mix(in srgb,var(--s-rec) 18%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.al.crit{border-left:4px solid var(--crit)} .al.warn{border-left:4px solid var(--warn)}
.al b{font-size:13.5px} .al .x{grid-column:2;color:var(--ink-2);font-size:12.5px}
.al .x code{font-family:var(--f-mono);font-size:12px;background:var(--sunken);padding:0 4px;border-radius:3px;cursor:pointer}
/* forms */
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
input.mono{font-family:var(--f-mono)}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--ink-3);min-height:16px}
.hint.warn{color:var(--warn)} .hint.crit{color:var(--crit)}
.calc{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters>*{flex:1 1 160px}
td input,td select{padding:5px 8px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tip{position:fixed;pointer-events:none;z-index:30;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:4px;max-width:260px;line-height:1.4;white-space:pre-line}
.dest-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.dest-card h3{margin:0;font:700 15px var(--f-body)}
.price-row{display:grid;grid-template-columns:1fr 100px 32px;gap:6px}
.price-list{display:flex;flex-direction:column}
.price-ro{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.price-ro:last-child{border-bottom:0}
.dest-card a.btn,.panel-h a.btn{text-decoration:none}
.price-ro b{font-variant-numeric:tabular-nums;white-space:nowrap}.price-ro small{font-weight:400;color:var(--ink-2);margin-left:2px}
.notice{padding:14px 16px;border-radius:var(--r);background:var(--sunken);border:1px dashed var(--line);color:var(--ink-2)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.kpis{}@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.month .lbl{min-width:120px;font-size:15px}.kpi .v{font-size:23px}.bar{grid-template-columns:minmax(80px,38%) 1fr auto}}


.inp-btn{display:flex;gap:6px}.inp-btn input{flex:1;min-width:0}
.scan-btn{padding:0 10px!important;flex-shrink:0}
.scan-ov{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scan-box{background:var(--surface);border-radius:12px;padding:16px;width:min(100%,480px);display:flex;flex-direction:column;gap:12px}
#scan-cam{width:100%;min-height:220px;background:#000;border-radius:8px;overflow:hidden}
#scan-cam video{width:100%!important;display:block;border-radius:8px}
/* tipo de negócio */
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button,.seg label{border:0;background:transparent;color:var(--ink-2);font:600 13px var(--f-body);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.pill.neg-rss{background:color-mix(in srgb,var(--s-loc) 16%,transparent);color:var(--s-loc)}
.pill.neg-ind{background:color-mix(in srgb,var(--s-dest) 15%,transparent);color:var(--s-dest)}
.pill.neg-none{background:var(--warn-bg);color:var(--warn)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r);margin-bottom:12px;font-size:13px;color:var(--ink-2)}
/* ---------- celular ---------- */
nav.tabs .ic,nav.tabs .t-short{display:none}
.rt td.full,.rt td.strong-m{}

  body{font-size:15px}
  input,select,textarea{font-size:16px}
  header.top{position:static}
  .top-row{gap:8px;padding-block:10px 10px;flex-wrap:wrap}
  .brand-row{flex-basis:100%;gap:10px}
  .brand span{display:none}

  .month button{width:40px;height:36px}
  .sync span{display:none}
  #u-nivel{display:none}
  #u-nome{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:2px;overflow:visible;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-bottom:0;border-radius:10px;font-size:11px;font-weight:600;position:relative}
  nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
<style>
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{width:auto}
tr.inativo td{opacity:.55}
tr.inativo td:last-child{opacity:1}
.acoes{display:flex;gap:6px;justify-content:flex-end}
.tag-uni{font-size:11.5px;color:var(--ink-3)}
.sem-uni{font-size:11.5px;color:var(--warn);font-weight:600}
.cnh{font:600 12px var(--f-mono);background:var(--sunken);border-radius:4px;padding:1px 6px}
.form-panel{border-left:4px solid var(--accent)}
.uni-sel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.uni-sel select{width:auto;padding:5px 8px;font-size:13px}
td.wrap{white-space:normal;min-width:160px}
.loc-total{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:20px}

.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface);cursor:pointer}
.chip input{width:auto;margin:0}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
h3.sec{font:600 14px var(--f-body);margin:18px 0 8px;color:var(--ink)}
.pill.st{white-space:nowrap}
.pill.st.lib{background:#e3edfb;color:#1f5fa8}
.pill.st.fat{background:#efe6fb;color:#6a3fb0}
.pill.st.nf{background:var(--ok-bg);color:var(--ok)}
.pill.st.ok{background:#dff3f0;color:#0e7466}
.pill.st.crit{background:var(--crit-bg);color:var(--crit)}
.pill.st.dest{background:#fbecd9;color:#93520f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.st.dest{background:#3a2a16;color:#f0b877}}
:root[data-theme="dark"] .pill.st.dest{background:#3a2a16;color:#f0b877}
.itens{display:flex;flex-direction:column;gap:8px}
.it-row{display:grid;grid-template-columns:minmax(0,1.3fr) 120px minmax(0,1.6fr) auto 34px;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken)}
.it-row .it-v{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.it-row .it-tr{grid-column:1/-1;font-size:12px;color:var(--warn)}
.it-tot{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.lib-falta{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:7px 10px;margin:0 0 10px}
@media (max-width:720px){.it-row{grid-template-columns:1fr 1fr}.it-row .it-r,.it-row .it-d{grid-column:1/-1}.it-row .it-v{grid-column:1/2}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.st.lib{background:#1c2c44;color:#8fb8ef}:root:not([data-theme="light"]) .pill.st.fat{background:#2c2240;color:#c3a6f0}:root:not([data-theme="light"]) .pill.st.ok{background:#14302b;color:#6fd3c2}}
:root[data-theme="dark"] .pill.st.lib{background:#1c2c44;color:#8fb8ef}:root[data-theme="dark"] .pill.st.fat{background:#2c2240;color:#c3a6f0}:root[data-theme="dark"] .pill.st.ok{background:#14302b;color:#6fd3c2}
.tag-imp{font:500 10.5px var(--f-mono);color:var(--ink-3);border:1px dashed var(--line);border-radius:4px;padding:0 4px;vertical-align:1px}
.funil{display:flex;flex-wrap:wrap;gap:0;list-style:none;margin:0 0 10px;padding:0;counter-reset:f}
.funil li{font-size:12px;color:var(--ink-3);padding:5px 12px 5px 18px;background:var(--sunken);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);margin-right:-4px}
.funil li:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-left:12px}
.funil li.feito{background:var(--accent-soft);color:var(--accent)}
.funil li.agora{background:var(--accent);color:var(--accent-ink);font-weight:600}
.fat-box{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);font-size:13.5px}
table.docs td input,table.docs td select{min-width:110px}
.dlg-ov{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dlg h3{font:700 18px var(--f-display);font-stretch:85%;margin:0 0 12px}
.dlg .fld{margin-bottom:10px}
.cli-card{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.cli-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
td.neg{color:var(--crit)}
table.itens td input,table.itens td select{min-width:70px}
.al.ok{border-color:var(--ok)}
.toolbar .seg{max-width:100%;overflow-x:auto;scrollbar-width:thin}
.toolbar .seg button{white-space:nowrap}
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.ind{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.ind:hover{border-color:var(--ink-3)}
.ind .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ind .v{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ind .d{font-size:12px;color:var(--ink-2)}
.ind.txt .v{font-size:19px;line-height:1.5}
.ind.crit .v{color:var(--crit)} .ind.warn .v{color:var(--warn)} .ind.zero .v{color:var(--ink-3)}
.ind[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand-row"><div class="logos" aria-label="Retec · Grupo GVC"><img class="l-retec" src="../img/logo-retec.png" alt="Retec"><i></i><img class="l-gvc" src="../img/logo-gvc.png" alt="Grupo GVC"></div><div class="brand"><span>Acompanhamento de clientes</span><b>Solicitações</b></div></div>
      <label class="uni-sel" id="uni-box" hidden>Unidade <select id="uni-sel" aria-label="Unidade"></select></label>
      <div class="row" style="gap:10px"><div class="sync" id="sync"><i></i><span>Conectando…</span></div><button class="btn sm" id="btn-atualizar" hidden>Atualizar</button><span id="u-box" class="row" style="gap:8px" hidden><span class="sync" style="flex-direction:column;align-items:flex-end;gap:0;line-height:1.2"><b id="u-nome" style="color:var(--ink);font-weight:600"></b><span id="u-nivel"></span></span><a class="btn sm" href="../" title="Voltar ao portal">⌂ Portal</a><button class="btn sm" id="btn-sair">Sair</button></span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="fila" aria-selected="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/></svg><span class="t-long">Fila</span><span class="t-short">Fila</span> <span class="ct" id="ct-fila">0</span></button>
      <button role="tab" data-tab="todas" aria-selected="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg><span class="t-long">Todas</span><span class="t-short">Todas</span></button>
      <button role="tab" data-tab="recorrentes" aria-selected="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v4h-4M20 12a8 8 0 0 1-14 5.3M4 20v-4h4"/></svg><span class="t-long">Recorrentes</span><span class="t-short">Recorr.</span></button>
      <button role="tab" data-tab="consultores" aria-selected="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5"/><path d="M16 4.5a3 3 0 0 1 0 6M18 15c1.6.6 2.6 2.2 3 5"/></svg><span class="t-long">Consultores</span><span class="t-short">Consult.</span></button>
      <button role="tab" data-tab="documentos" aria-selected="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg><span class="t-long">Documentos</span><span class="t-short">Docs</span></button>
      <button role="tab" data-tab="importar" aria-selected="false" id="tab-importar" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg><span class="t-long">Importar planilha</span><span class="t-short">Importar</span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><div class="notice">Carregando as solicitações…</div></main>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = v => v === '' || v == null ? '—' : (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const D = iso => iso ? iso.split('-').reverse().join('/') : '';
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const NIVEL_LBL = { leitor: 'Leitor', editor: 'Editor', admin: 'Administrador' };
const TABS = ['fila', 'todas', 'recorrentes', 'consultores', 'documentos', 'importar'];
const DIAS_SEM = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const ABERTAS = ['Recebida', 'Documentação pendente', 'Liberada para programar', 'Programada', 'Frustrada'];
const S = { tab: 'fila', d: null, ro: true, uni: '', busca: '', st: '', mes: '', inativos: false, edit: null, abrir: null, mesCon: '', indCon: '' };

function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3600); }
function setSync(ok, txt) { const s = $('#sync'); s.classList.toggle('on', ok); s.querySelector('span').textContent = txt; }
function falha(e) { toast((e && e.mensagem) || 'Não foi possível salvar. Verifique a internet e tente de novo.'); }
const opts = (lista, sel, vazio) => (vazio !== undefined ? `<option value="">${esc(vazio)}</option>` : '') + lista.map(v => { const [val, lbl] = Array.isArray(v) ? v : [v, v]; return `<option value="${esc(val)}" ${String(val) === String(sel ?? '') ? 'selected' : ''}>${esc(lbl)}</option>`; }).join('');

/* ---------- janela simples para pedir dados (motivo, data…) ---------- */
function pedir(titulo, campos, okTxt) {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'dlg-ov';
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h3>${esc(titulo)}</h3>
      ${campos.map((c, i) => `<div class="fld"><label for="dlg-${i}">${esc(c.rotulo)}</label>${c.tipo === 'area' ? `<textarea id="dlg-${i}" rows="3">${esc(c.valor || '')}</textarea>` : `<input id="dlg-${i}" type="${c.tipo || 'text'}" value="${esc(c.valor || '')}" ${c.tipo === 'number' ? 'step="any"' : ''}>`}</div>`).join('')}
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>${esc(okTxt || 'Confirmar')}</button></div></div>`;
    document.body.appendChild(ov);
    const fim = v => { ov.remove(); res(v); };
    ov.querySelector('[data-x]').onclick = () => fim(null);
    ov.onclick = e => { if (e.target === ov) fim(null); };
    ov.addEventListener('keydown', e => { if (e.key === 'Escape') fim(null); });
    ov.querySelector('[data-ok]').onclick = () => fim(campos.map((c, i) => ov.querySelector('#dlg-' + i).value.trim()));
    setTimeout(() => { const f = ov.querySelector('input,textarea'); if (f) f.focus(); }, 30);
  });
}

/* ---------- dados auxiliares ---------- */
const cliDe = id => (S.d.clientes.find(c => c.id === id) || {});
const cliNome = id => cliDe(id).nome || '';
const cliRot = c => (c.codigoUplog ? c.codigoUplog + ' · ' : '') + c.nome;
const conNome = id => (S.d.consultores.find(c => c.id === id) || {}).nome || '';
const uniNome = id => (S.d.todasUnidades.find(u => u.id === id) || {}).nome || '';
const tdNome = id => (S.d.tiposDocumento.find(t => t.id === id) || {}).nome || '';
const resNome = id => (S.d.residuos.find(r => r.id === id) || {}).nome || '';
const destDe = id => (S.d.destinadores || []).find(d => d.id === id) || null;
const destNome = id => (destDe(id) || {}).nome || '';
const kgF = v => (+v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' kg';
const R4 = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 4 });
const itensDe = id => (S.d.itens || []).filter(i => i.solicitacaoId === id).sort((a, b) => a.ordem - b.ordem);
const semDest = serv => (S.d.listas.servicoSemDestinacao || []).includes(serv || '');
const docsDe = id => S.d.documentos.filter(d => d.solicitacaoId === id);
const pendentes = id => docsDe(id).filter(d => d.situacao === 'Pendente').length;
const passaUni = x => !S.uni || x.unidadeId === S.uni;
const passaBusca = txt => !S.busca || txt.toLowerCase().includes(S.busca.toLowerCase());
function statusPill(st) {
  const cls = { 'Recebida': '', 'Documentação pendente': 'warn', 'Liberada para programar': 'lib', 'Programada': 'lib', 'Realizada': 'ok', 'Destinação': 'dest', 'BM enviado': 'fat', 'NF emitida': 'nf', 'Cancelada': 'crit', 'Frustrada': 'crit' }[st] || '';
  return `<span class="pill st ${cls}">${esc(st)}</span>`;
}

/* ---------- carregar ---------- */
async function carregar(silencioso, semRedesenhar) {
  if (!silencioso) setSync(false, 'Carregando…');
  try {
    S.d = await Portal.api('sol.dados', {});
    S.ro = !Portal.podeEditar('solicitacoes');
    setSync(true, (S.ro ? 'Somente leitura · ' : '') + 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
    $('#tab-importar').hidden = !S.d.podeImportar;
    if (S.edit && S.edit.id) { const s = S.d.solicitacoes.find(x => x.id === S.edit.id); S.edit = s ? { ...s } : null; }
    montarUnidades(); if (!semRedesenhar) render();
  } catch (e) {
    setSync(false, 'Sem conexão');
    if (!S.d) $('#main').innerHTML = `<section class="panel"><h2>Não consegui carregar as solicitações</h2><p class="sub">${esc((e && e.mensagem) || 'Verifique a internet.')}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="tentar">Tentar de novo</button></div></section>`;
    const t = $('#tentar'); if (t) t.onclick = () => carregar();
  }
}
function montarUnidades() {
  const us = S.d.unidades; const box = $('#uni-box'), sel = $('#uni-sel');
  if (us.length <= 1) { box.hidden = true; S.uni = ''; return; }
  box.hidden = false;
  sel.innerHTML = opts([['', 'Todas'], ...us.map(u => [u.id, u.nome])], S.uni);
  sel.onchange = () => { S.uni = sel.value; render(); };
}

/* ---------- abas ---------- */
function setTab(t) {
  if (!TABS.includes(t) || (t === 'importar' && !(S.d && S.d.podeImportar))) t = 'fila';
  S.tab = t; S.edit = null;
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  render(); scrollTo({ top: 0 });
}
$$('nav.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
function render() {
  if (!S.d) return;
  const abertas = S.d.solicitacoes.filter(s => ABERTAS.includes(s.status) && passaUni(s));
  $('#ct-fila').textContent = abertas.length;
  ({ fila: renderFila, todas: renderTodas, recorrentes: renderRecorrentes, consultores: renderConsultores, documentos: renderDocumentos, importar: renderImportar })[S.tab]();
}

/* ---------- formulário da solicitação ---------- */
function formSol() {
  const e = S.edit; if (!e) return '';
  const L = S.d.listas;
  const cli = cliDe(e.clienteId);
  const fat = e.faturamento;
  const travado = S.ro;
  const clientesAtivos = S.d.clientes.filter(c => c.ativo || c.id === e.clienteId);
  const docs = e.id ? docsDe(e.id) : [];
  const resAtivos = S.d.residuos.filter(r => r.ativo || (e.residuoIds || []).includes(r.id));
  return `<section class="panel form-panel" id="form-panel">
    <div class="panel-h"><div><h2>${e.id ? esc(cliNome(e.clienteId) || 'Solicitação') + ' · ' + esc(D(e.dataSolicitacao)) : 'Nova solicitação'}</h2>
      ${e.id ? `<p class="sub">${statusPill(e.status)} ${e.origem === 'planilha' ? '<span class="tag-imp" title="Importada da planilha de acompanhamento">planilha</span>' : ''} ${e.motivo ? '· Motivo: ' + esc(e.motivo) : ''}</p>` : '<p class="sub">O cliente vem do Mapa Operacional (código UPLOG). Os documentos exigidos para o cliente entram sozinhos no checklist.</p>'}</div>
      <button class="btn sm" id="f-cancel" type="button">Fechar</button></div>
    ${e.id ? funil(e) : ''}
    ${e.id && ['Recebida', 'Documentação pendente', 'Frustrada', 'Cancelada'].includes(e.status) && !S.ro && faltaLiberar(e) ? `<p class="lib-falta">${esc(faltaLiberar(e))}</p>` : ''}
    <form id="f" class="form" autocomplete="off">
      <div class="fld full"><label for="f-cli">Cliente</label>
        <div class="row" style="gap:6px;flex-wrap:nowrap"><input id="f-cli" list="dl-cli" required value="${esc(cli.id ? cliRot(cli) : '')}" placeholder="Código UPLOG ou nome" ${travado ? 'disabled' : ''}>
        ${travado ? '' : '<button class="btn sm" type="button" id="f-novo-cli" title="Cadastrar cliente que ainda não está no Mapa">+ Novo cliente</button>'}</div>
        <datalist id="dl-cli">${clientesAtivos.map(c => `<option value="${esc(cliRot(c))}">`).join('')}</datalist>
        <div class="hint" id="h-cli">${cli.id ? `<a href="../mapa/?abrir=${encodeURIComponent(cli.id)}" target="_blank" rel="noopener">Abrir no Mapa ↗</a>` : ''}</div></div>
      <div class="fld"><label for="f-uni">Unidade</label><select id="f-uni" required>${opts(S.d.unidades.map(u => [u.id, u.nome]), e.unidadeId, 'Escolha…')}</select></div>
      <div class="fld"><label for="f-con">Consultor</label><select id="f-con">${opts(S.d.consultores.filter(c => c.ativo || c.id === e.consultorId).map(c => [c.id, c.nome]), e.consultorId, 'Sem consultor')}</select></div>
      <div class="fld"><label for="f-serv">Serviço</label><select id="f-serv">${opts(L.servico.concat(e.servico && !L.servico.includes(e.servico) ? [e.servico] : []), e.servico, '—')}</select></div>
      <div class="fld"><label for="f-dem">Demanda</label><select id="f-dem">${opts(L.demanda, e.demanda, '—')}</select></div>
      <div class="fld"><label for="f-perf">Perfil</label><select id="f-perf">${opts(L.perfil, e.perfil, '—')}</select></div>
      <div class="fld"><label for="f-exec">Execução</label><select id="f-exec">${opts(L.execucao, e.execucao, '—')}</select></div>
      <div class="fld"><label for="f-dsc">Data da solicitação do consultor</label><input id="f-dsc" type="date" value="${esc(e.dataSolicitacaoConsultor)}"></div>
      <div class="fld"><label for="f-ds">Data da solicitação</label><input id="f-ds" type="date" required value="${esc(e.dataSolicitacao)}"></div>
      <div class="fld"><label for="f-dp">Data prevista da coleta</label><input id="f-dp" type="date" value="${esc(e.dataPrevista)}"></div>
      <div class="fld"><label for="f-dc">Data da coleta (realizada)</label><input id="f-dc" type="date" value="${esc(e.dataColeta)}"></div>
      <div class="fld"><label for="f-val">Valor previsto (R$)</label><input id="f-val" type="number" step="any" min="0" value="${esc(e.valorPrevisto)}"></div>
      <div class="fld full" style="grid-column:1/-1"><label>Resíduos e destinação prevista (da precificação)</label>
        <div class="itens" id="f-itens">${itensHTML(e, travado)}</div>

const valorSol = s => s.faturamento ? +(s.faturamento.nfValor !== '' ? s.faturamento.nfValor : s.faturamento.bmValor) || 0 : (s.valorPrevisto === '' || s.valorPrevisto == null ? '' : +s.valorPrevisto);
const bmnfTxt = s => s.faturamento ? (s.faturamento.nfNumero ? 'NF ' + s.faturamento.nfNumero : s.faturamento.bmNumero ? 'BM ' + s.faturamento.bmNumero : s.faturamento.status) + (s.faturamento.nfData ? ' · ' + D(s.faturamento.nfData) : '') : '';
function colsSol(comFat) {
  return [
    { k: 'cli', label: 'Cliente', v: s => cliNome(s.clienteId) },
    { k: 'uni', label: 'Unidade', v: s => uniNome(s.unidadeId) },
    { k: 'con', label: 'Consultor', v: s => conNome(s.consultorId) },
    { k: 'sol', label: 'Solicitada', v: s => D(s.dataSolicitacao), ord: s => s.dataSolicitacao || '' },
    comFat ? { k: 'col', label: 'Coleta', v: s => D(s.dataColeta), ord: s => s.dataColeta || '' }
           : { k: 'prev', label: 'Prevista', v: s => D(s.dataPrevista || s.dataColeta), ord: s => s.dataPrevista || s.dataColeta || '' },
    { k: 'st', label: 'Status', v: s => s.status },
  ].concat(comFat ? [
    { k: 'val', label: 'Valor', v: s => R(valorSol(s)), ord: s => +valorSol(s) || 0, num: true, x: s => valorSol(s), fmt: FMT_R },
    { k: 'bmnf', label: 'BM / NF', v: s => bmnfTxt(s) },
  ] : []);
}
const EXTRAS_SOL = [{ label: 'Código UPLOG', x: s => cliDe(s.clienteId).codigoUplog || '' }, { label: 'Serviço', x: s => s.servico || '' },
  { label: 'Descrição', x: s => s.descricao || '' }, { label: 'Origem', x: s => s.origem || '' }, { label: 'Motivo', x: s => s.motivo || '' }];
const filtrosTopo = (...xs) => xs.filter(Boolean);

    <td data-label="${comFat ? 'Coleta' : 'Prevista'}" class="mono">${esc(D(comFat ? s.dataColeta : (s.dataPrevista || s.dataColeta)))}</td>

    ${comFat ? `<td data-label="Valor" class="num">${R(s.faturamento ? (s.faturamento.nfValor !== '' ? s.faturamento.nfValor : s.faturamento.bmValor) : s.valorPrevisto)}</td><td data-label="BM/NF" class="mono">${s.faturamento ? esc((s.faturamento.nfNumero ? 'NF ' + s.faturamento.nfNumero : s.faturamento.bmNumero ? 'BM ' + s.faturamento.bmNumero : s.faturamento.status) + (s.faturamento.nfData ? ' · ' + D(s.faturamento.nfData) : '')) : ''}</td>` : ''}

}
function ligarLinhas() { $$('[data-sol]').forEach(tr => { tr.onclick = () => abrir(tr.dataset.sol); tr.onkeydown = ev => { if (ev.key === 'Enter') abrir(tr.dataset.sol); }; }); }
function renderFila() {
  const base = S.d.solicitacoes.filter(s => ABERTAS.includes(s.status) && passaUni(s));

      <span style="margin-left:auto">${T.botao()}</span>${S.ro ? '' : '<button class="btn pri" id="novo">+ Solicitação</button>'}</div>

function renderTodas() {

/* ---------- consultores ---------- */
async function excluirCad(tabela, x) {
  if (!confirm('Excluir "' + x.nome + '"?')) return;
  try { await Portal.api('sol.excluirCadastro', { tabela, id: x.id }); toast('Excluído'); await carregar(true); }
  catch (e) { if (e && e.erro === 'em_uso') { if (await Portal.confirmarInativar(e, x.nome)) { await Portal.api('sol.ativoCadastro', { tabela, id: x.id, ativo: false }); toast('Inativado'); await carregar(true); } } else falha(e); }
}
const EM_ANDAMENTO = ['Recebida', 'Documentação pendente', 'Liberada para programar', 'Programada'];
const REALIZADAS = ['Realizada', 'Destinação', 'BM enviado', 'NF emitida'];
function renderConsultores() {
  // só consulta: o cadastro (e o acesso ao portal) fica no módulo Pessoas
  if (!S.mesCon) S.mesCon = hojeISO().slice(0, 7);
  const mes = S.mesCon;
  const MESES_N = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const mesLbl = MESES_N[+mes.slice(5, 7) - 1] + ' ' + mes.slice(0, 4);
  const sols = S.d.solicitacoes.filter(x => passaUni(x));
  const doMes = sols.filter(x => (x.dataSolicitacao || '').startsWith(mes) && x.status !== 'Cancelada');
  const real = sols.filter(x => REALIZADAS.includes(x.status) && (x.dataColeta || '').startsWith(mes));
  const and = sols.filter(x => EM_ANDAMENTO.includes(x.status));
  const por = (l, id) => l.filter(x => x.consultorId === id);
  const M = {}; S.d.consultores.forEach(c => { const dm = por(doMes, c.id);
    M[c.id] = { mes: dm.length, and: por(and, c.id).length, real: por(real, c.id).length, valor: dm.reduce((t, x) => t + (+x.valorPrevisto || 0), 0), total: por(sols, c.id).length }; });
  const m = id => M[id] || { mes: 0, and: 0, real: 0, valor: 0, total: 0 };
  const ativos = S.d.consultores.filter(c => c.ativo);
  const top = S.d.consultores.filter(c => m(c.id).mes > 0).sort((a, b) => m(b.id).mes - m(a.id).mes || m(b.id).valor - m(a.id).valor)[0];
  const IND = {
    mes: { k: 'Com solicitações no mês', f: c => m(c.id).mes > 0 },
    and: { k: 'Com solicitações em andamento', f: c => m(c.id).and > 0 },
    real: { k: 'Com coletas realizadas no mês', f: c => m(c.id).real > 0 },
    valor: { k: 'Com valor previsto no mês', f: c => m(c.id).valor > 0 },
    top: { k: 'Destaque do mês', f: c => top && c.id === top.id },
  };
  if (S.indCon && !IND[S.indCon]) S.indCon = '';
  const fInd = S.indCon ? IND[S.indCon].f : () => true;
  const lista = S.d.consultores.filter(c => (S.inativos || c.ativo) && fInd(c)).sort((a, b) => (b.ativo - a.ativo) || a.nome.localeCompare(b.nome, 'pt-BR'));
  const semCon = doMes.filter(x => !x.consultorId).length;
  const comCon = doMes.length - semCon;
  const card = (id, k, v, d, vazio) => `<button type="button" class="ind ${vazio ? 'zero' : ''} ${id === 'top' ? 'txt' : ''}" data-ind="${id}" aria-pressed="${!!id && S.indCon === id}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span><span class="d">${esc(d)}</span></button>`;
  const soma = l => l.filter(x => x.consultorId).reduce((t, x) => t + (+x.valorPrevisto || 0), 0);
  const inds = `<div class="inds" role="group" aria-label="Indicadores dos consultores">
    ${card('', 'Consultores ativos', ativos.length, (S.d.consultores.length - ativos.length) + ' inativo(s)', !ativos.length)}
    ${card('mes', 'Solicitações no mês', comCon, semCon ? semCon + ' sem consultor' : 'todas com consultor', !comCon)}
    ${card('and', 'Em andamento', and.filter(x => x.consultorId).length, 'recebidas, liberadas e programadas', !and.filter(x => x.consultorId).length)}
    ${card('real', 'Realizadas no mês', real.filter(x => x.consultorId).length, 'coletas feitas em ' + mesLbl, !real.filter(x => x.consultorId).length)}
    ${card('valor', 'Valor previsto no mês', R(soma(doMes)), 'solicitações com consultor', !soma(doMes))}
    ${card('top', 'Destaque do mês', top ? (top.nome.split(' ').length > 1 ? top.nome.split(' ')[0] + ' ' + top.nome.split(' ').slice(-1)[0] : top.nome) : '—', top ? m(top.id).mes + ' solicitação(ões) · ' + R(m(top.id).valor) : 'nenhuma solicitação no mês', !top)}
  </div>`;
  const TC = Portal.tabela('sol-con', [
    { k: 'nome', label: 'Nome', v: c => c.nome }, { k: 'email', label: 'E-mail', v: c => c.email }, { k: 'tel', label: 'Telefone', v: c => c.telefone },
    { k: 'mes', label: 'No mês', v: c => String(m(c.id).mes), ord: c => m(c.id).mes, x: c => m(c.id).mes, num: true },
    { k: 'and', label: 'Em andamento', v: c => String(m(c.id).and), ord: c => m(c.id).and, x: c => m(c.id).and, num: true },
    { k: 'real', label: 'Realizadas', v: c => String(m(c.id).real), ord: c => m(c.id).real, x: c => m(c.id).real, num: true },
    { k: 'valor', label: 'Valor previsto (R$)', v: c => R(m(c.id).valor), ord: c => m(c.id).valor, x: c => m(c.id).valor, fmt: '#,##0.00', num: true },
    { k: 'qtd', label: 'Total', v: c => String(m(c.id).total), ord: c => m(c.id).total, x: c => m(c.id).total, num: true },
  ], { titulo: 'Consultores', arquivo: 'consultores', unidade: 'consultores', aoMudar: render, totais: l => ({ 'No mês': l.reduce((t, c) => t + m(c.id).mes, 0), 'Valor previsto (R$)': l.reduce((t, c) => t + m(c.id).valor, 0) }),
    subtitulo: () => ['Mês: ' + mesLbl, S.uni ? 'Unidade: ' + uniNome(S.uni) : ''].filter(Boolean).join(' · '),
    extrasExport: [{ label: 'Situação', x: c => c.ativo ? 'Ativo' : 'Inativo' }],
    filtrosExtras: () => filtrosTopo(S.indCon && 'Indicador: ' + IND[S.indCon].k, S.inativos && 'Mostrando os inativos') });
  const listaC = TC.aplicar(lista);
  $('#main').innerHTML = `<section class="panel">
    <div class="panel-h"><div><h2>Consultores</h2><p class="sub">Quem traz a solicitação do cliente, só para consulta (o cadastro fica no módulo Pessoas). No mês, Realizadas e Valor previsto são do mês escolhido; Em andamento é a situação de hoje. Clique num indicador para filtrar a lista.</p></div>
      <div class="month"><button id="cm-prev" aria-label="Mês anterior">‹</button><span class="lbl">${esc(mesLbl)}</span><button id="cm-next" aria-label="Próximo mês">›</button></div></div>
    ${inds}
    <div class="toolbar"><label class="chk"><input type="checkbox" id="inat" ${S.inativos ? 'checked' : ''}> Mostrar inativos</label>
      ${S.indCon ? `<span class="pill">${esc(IND[S.indCon].k)} <button class="btn sm" id="ind-limpar" style="padding:0 6px;margin-left:4px" aria-label="Tirar o filtro do indicador">×</button></span>` : ''}
      <span style="margin-left:auto">${TC.botao()}</span></div>
    ${TC.info(listaC.length, lista.length)}
    ${lista.length ? `<div class="tbl-wrap"><table><thead>${TC.cab()}</thead><tbody>
    ${listaC.map(c => `<tr class="${c.ativo ? '' : 'inativo'}"><td><b>${esc(c.nome)}</b>${top && top.id === c.id ? ' <span class="pill ok">destaque</span>' : ''}</td><td>${esc(c.email || '—')}</td><td>${esc(c.telefone || '—')}</td>
      <td class="num">${m(c.id).mes}</td><td class="num">${m(c.id).and}</td><td class="num">${m(c.id).real}</td><td class="num">${R(m(c.id).valor)}</td><td class="num">${m(c.id).total}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">Nenhum consultor com esses filtros.</td></tr>'}
    </tbody></table></div>` : `<div class="empty">${S.indCon ? 'Nenhum consultor neste indicador.' : 'Nenhum consultor cadastrado. O cadastro é feito no módulo Pessoas, com a função Consultor.'}</div>`}</section>`;
  TC.ligar();
  const mudaMes = d => { const [y, mm] = S.mesCon.split('-').map(Number); const t = new Date(y, mm - 1 + d, 1); S.mesCon = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0'); render(); };
  $('#cm-prev').onclick = () => mudaMes(-1); $('#cm-next').onclick = () => mudaMes(1);
  $$('[data-ind]').forEach(x => x.onclick = () => { const id = x.dataset.ind; S.indCon = !id || S.indCon === id ? '' : id; render(); });
  const li = $('#ind-limpar'); if (li) li.onclick = () => { S.indCon = ''; render(); };
  const i = $('#inat'); if (i) i.onchange = () => { S.inativos = i.checked; render(); };
}

/* ---------- documentos: catálogo, padrão por cliente e serviços ---------- */
function renderDocumentos() {
  const tipos = S.d.tiposDocumento.slice().sort((a, b) => (b.ativo - a.ativo) || a.nome.localeCompare(b.nome, 'pt-BR'));
  const usoDoc = id => S.d.documentosPadrao.filter(d => d.tipoDocumentoId === id).length;
  const TD = Portal.tabela('sol-tdoc', [
    { k: 'nome', label: 'Documento', v: t => t.nome }, { k: 'sit', label: 'Situação', v: t => t.ativo ? 'Ativo' : 'Inativo' },
    { k: 'cli', label: 'Clientes com este documento', v: t => String(usoDoc(t.id)), ord: t => usoDoc(t.id), num: true },
  ], { titulo: 'Tipos de documento', arquivo: 'tipos-de-documento', unidade: 'tipos', aoMudar: render });
  const tiposF = TD.aplicar(tipos);
  const cliSel = S.abrir && cliDe(S.abrir).id ? cliDe(S.abrir) : null;
  const padrao = cliSel ? S.d.documentosPadrao.filter(d => d.cadastroId === cliSel.id) : [];
  const comPadrao = [...new Set(S.d.documentosPadrao.map(d => d.cadastroId))].map(cliDe).filter(c => c.id);
  $('#main').innerHTML = `<section class="panel">
    <div class="panel-h"><div><h2>Documentos exigidos por cliente</h2><p class="sub">Marque os documentos que o cliente sempre pede. Eles entram sozinhos no checklist de cada solicitação nova desse cliente (e dos cadastros auxiliares ligados a ele).</p></div></div>
    <div class="toolbar"><input id="d-cli" list="dl-cli2" placeholder="Código UPLOG ou nome do cliente" value="${esc(cliSel ? cliRot(cliSel) : '')}" style="max-width:420px" aria-label="Cliente">
      <datalist id="dl-cli2">${S.d.clientes.filter(c => c.ativo).map(c => `<option value="${esc(cliRot(c))}">`).join('')}</datalist></div>
    ${cliSel ? `<div class="chips">${tipos.filter(t => t.ativo).map(t => { const p = padrao.find(d => d.tipoDocumentoId === t.id); return `<label class="chip"><input type="checkbox" data-pad="${t.id}" ${p ? 'checked' : ''} ${S.ro ? 'disabled' : ''}> ${esc(t.nome)}</label>`; }).join('')}</div>
      ${S.ro ? '' : '<div class="row" style="margin-top:10px"><button class="btn pri" id="pad-salvar">Salvar documentos do cliente</button></div>'}`
      : `<p class="sub">${comPadrao.length ? 'Clientes com documentos definidos: ' + comPadrao.map(c => `<a href="#" data-pcli="${c.id}">${esc(c.nome)}</a>`).join(', ') : 'Nenhum cliente com documentos definidos ainda.'}</p>`}
  </section>
  <section class="panel"><div class="panel-h"><div><h2>Tipos de documento</h2><p class="sub">Catálogo usado nos checklists.</p></div></div>
    <div class="toolbar">${S.ro ? '' : '<input id="td-novo" placeholder="Novo tipo de documento" style="max-width:320px"><button class="btn" id="td-add">Adicionar</button>'}<span style="margin-left:auto">${TD.botao()}</span></div>
    ${TD.info(tiposF.length, tipos.length)}
    <div class="tbl-wrap"><table><thead>${TD.cab('<th></th>')}</thead><tbody>${tiposF.map(t => `<tr class="${t.ativo ? '' : 'inativo'}"><td>${esc(t.nome)}</td><td>${t.ativo ? 'Ativo' : '<span class="pill">Inativo</span>'}</td><td class="num">${usoDoc(t.id)}</td><td><div class="acoes">${S.ro ? '' : `<button class="btn sm" data-tren="${t.id}">Renomear</button>`}<button class="btn sm" data-thist="${t.id}">Histórico</button>${S.ro ? '' : t.ativo ? `<button class="btn sm danger" data-tdel="${t.id}">Excluir</button>` : `<button class="btn sm" data-treat="${t.id}">Reativar</button>`}</div></td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nenhum tipo com os filtros das colunas.</td></tr>'}</tbody></table></div>
  </section>
  <section class="panel"><div class="panel-h"><div><h2>Serviços</h2><p class="sub">Lista do campo "Serviço" da solicitação. Um por linha, na ordem em que devem aparecer.</p></div></div>
    <textarea id="serv" rows="5" ${S.ro ? 'disabled' : ''} style="max-width:420px">${esc(S.d.listas.servico.join('\n'))}</textarea>
    <h3 class="sec" style="margin-top:12px">Serviços sem destinação</h3>
    <p class="sub">Marque os serviços que não levam resíduo para destinador (ex.: só locação). Eles não pedem destinador para liberar nem MTR na coleta, e vão de Realizada direto para o BM.</p>
    <div class="chips" id="serv-sd">${S.d.listas.servico.map(v => `<label class="chip"><input type="checkbox" value="${esc(v)}" ${semDest(v) ? 'checked' : ''} ${S.ro ? 'disabled' : ''}> ${esc(v)}</label>`).join('')}</div>
    ${S.ro ? '' : '<div class="row" style="margin-top:8px"><button class="btn" id="serv-salvar">Salvar serviços</button></div>'}</section>`;
  TD.ligar();
  const dc = $('#d-cli'); dc.onchange = () => { const v = dc.value.trim(); const c = S.d.clientes.find(c => cliRot(c) === v) || S.d.clientes.find(c => c.codigoUplog === v); S.abrir = c ? c.id : null; render(); };
  $$('[data-pcli]').forEach(a => a.onclick = ev => { ev.preventDefault(); S.abrir = a.dataset.pcli; render(); });
  const ps = $('#pad-salvar'); if (ps) ps.onclick = async () => { try { await Portal.api('sol.docsPadrao', { cadastroId: cliSel.id, itens: $$('[data-pad]:checked').map(x => ({ tipoDocumentoId: x.dataset.pad })) }); toast('Documentos do cliente salvos'); await carregar(true); } catch (e) { falha(e); } };
  const ta = $('#td-add'); if (ta) ta.onclick = async () => { const n = $('#td-novo').value.trim(); if (!n) return; try { await Portal.api('sol.salvarCadastro', { tabela: 'TiposDocumento', registro: { nome: n } }); await carregar(true); } catch (e) { falha(e); } };
  const achar = id => S.d.tiposDocumento.find(t => t.id === id);
  $$('[data-tren]').forEach(b => b.onclick = async () => { const t = achar(b.dataset.tren); const v = await pedir('Renomear documento', [{ rotulo: 'Nome', valor: t.nome }], 'Salvar'); if (!v || !v[0]) return; try { await Portal.api('sol.salvarCadastro', { tabela: 'TiposDocumento', registro: { id: t.id, nome: v[0] } }); await carregar(true); } catch (e) { falha(e); } });
  $$('[data-thist]').forEach(b => b.onclick = () => Portal.mostrarHistorico('TiposDocumento', b.dataset.thist, achar(b.dataset.thist).nome));
  $$('[data-tdel]').forEach(b => b.onclick = () => excluirCad('TiposDocumento', achar(b.dataset.tdel)));
  $$('[data-treat]').forEach(b => b.onclick = async () => { await Portal.api('sol.ativoCadastro', { tabela: 'TiposDocumento', id: b.dataset.treat, ativo: true }).catch(falha); await carregar(true); });
  const sv = $('#serv-salvar'); if (sv) sv.onclick = async () => { try {
    const vals = $('#serv').value.split('\n').map(x => x.trim()).filter(Boolean);
    await Portal.api('sol.salvarLista', { lista: 'servico', valores: vals });
    await Portal.api('sol.salvarLista', { lista: 'servicoSemDestinacao', valores: $$('#serv-sd input:checked').map(x => x.value).filter(v => vals.includes(v)) });
    toast('Serviços salvos'); await carregar(true); } catch (e) { falha(e); } };
}

/* ---------- importar a planilha de acompanhamento (admin do portal) ---------- */
let XLSX_PROMISE = null;
function carregarXlsx() {
  if (window.XLSX) return Promise.resolve();
  return XLSX_PROMISE || (XLSX_PROMISE = new Promise((ok, erro) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => { XLSX_PROMISE = null; erro(new Error('Não consegui carregar o leitor de planilhas.')); }; document.head.appendChild(s); }));
}
const iso = v => v instanceof Date && !isNaN(v) ? (v.getFullYear() < 1950 ? '' : v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0')) : (v == null ? '' : v);
async function lerColetas(arquivo) {
  await carregarXlsx();
  const wb = XLSX.read(await arquivo.arrayBuffer(), { type: 'array', cellDates: true });
  const nome = wb.SheetNames.find(n => /coletas/i.test(n)); if (!nome) throw new Error('A planilha não tem a aba "Coletas".');
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: null });
  const hi = rows.findIndex(r => r && String(r[0] || '').trim() === 'Solicitante'); if (hi < 0) throw new Error('Não achei o cabeçalho (coluna "Solicitante") na aba Coletas.');
  const H = rows[hi].map(h => String(h || '').trim());
  const iCli = H.indexOf('Cliente');
  const out = [];
  rows.slice(hi + 1).forEach((r, k) => { if (!r || !r[iCli]) return; const o = { _linha: hi + k + 2 }; H.forEach((h, j) => { if (h) o[h] = iso(r[j]); }); out.push(o); });
  return out;
}
function renderImportar() {
  $('#main').innerHTML = `<section class="panel"><div class="panel-h"><div><h2>Importar a planilha de acompanhamento</h2>
    <p class="sub">Escolha o arquivo .xlsx (aba "Coletas"). Primeiro o portal mostra o que vai entrar; nada é gravado até você confirmar. Pode importar de novo depois: o que já entrou não é duplicado.</p></div></div>
    <div class="toolbar"><input type="file" id="imp-arq" accept=".xlsx,.xls" aria-label="Arquivo da planilha"></div>
    <div id="imp-res"></div></section>`;
  let linhas = null;
  $('#imp-arq').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    const box = $('#imp-res'); box.innerHTML = '<p class="sub">Lendo a planilha…</p>';
    try {
      linhas = await lerColetas(f);
      const r = await Portal.api('sol.importar', { linhas, simular: true });
      box.innerHTML = resumoImport(r, true) + (r.novas ? '<div class="row" style="margin-top:12px"><button class="btn pri" id="imp-ok">Importar ' + r.novas + ' solicitação(ões)</button></div>' : '');
      const b = $('#imp-ok'); if (b) b.onclick = async () => {
        b.disabled = true; b.textContent = 'Importando…';
        try { const r2 = await Portal.api('sol.importar', { linhas }); box.innerHTML = '<div class="al ok"><span class="pill ok">Ok</span><b>Importação concluída.</b></div>' + resumoImport(r2, false); await carregar(true, true); }
        catch (e) { b.disabled = false; b.textContent = 'Tentar de novo'; falha(e); }
      };
    } catch (e) { box.innerHTML = `<div class="al crit"><span class="pill crit">Erro</span><b>${esc((e && (e.mensagem || e.message)) || 'Não consegui ler a planilha.')}</b></div>`; }
  };
}
function resumoImport(r, sim) {
  const st = Object.entries(r.status || {}).map(([k, v]) => `${esc(k)}: <b>${v}</b>`).join(' · ');
  return `<div class="kpis" style="margin-top:10px">
      <div class="kpi"><div class="k">Linhas lidas</div><div class="v">${r.lidas}</div></div>
      <div class="kpi"><div class="k">${sim ? 'Vão entrar' : 'Importadas'}</div><div class="v">${r.novas}</div><div class="d">${r.jaImportadas} já estavam no portal</div></div>
      <div class="kpi"><div class="k">Clientes novos no Mapa</div><div class="v">${r.clientesNovos}</div></div>
      <div class="kpi"><div class="k">BM/NF no Faturamento</div><div class="v">${r.faturamentos}</div><div class="d">${r.consultoresNovos} consultor(es) novo(s)</div></div></div>
    ${st ? `<p class="sub" style="margin-top:8px">Status no portal: ${st}</p>` : ''}
    ${(r.clientesNovosLista || []).length ? `<details style="margin-top:8px"><summary>Clientes que serão criados (${r.clientesNovosLista.length})</summary><p class="sub">${r.clientesNovosLista.map(esc).join(' · ')}</p></details>` : ''}
    ${(r.consultoresNovosLista || []).length ? `<p class="sub">Consultores novos: ${r.consultoresNovosLista.map(esc).join(', ')}</p>` : ''}
    ${(r.avisos || []).length ? `<details><summary>Avisos (${r.avisos.length})</summary><p class="sub">${r.avisos.map(esc).join('<br>')}</p></details>` : ''}`;
}

/* ---------- início ---------- */
$('#btn-sair').onclick = () => Portal.sair();
$('#btn-atualizar').onclick = () => carregar();
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== S.tab) setTab(t); });
(async function start() {
  let u;
  try { u = await Portal.exigir('solicitacoes'); }
  catch (e) { $('#main').innerHTML = `<section class="panel"><h2>Não consegui falar com o portal</h2><p class="sub">${esc((e && e.mensagem) || '')}</p></section>`; return; }
  const mostrar = us => { $('#u-box').hidden = false; $('#btn-atualizar').hidden = false; $('#u-nome').textContent = us.nome; $('#u-nivel').textContent = NIVEL_LBL[Portal.nivel('solicitacoes', us)] || ''; };
  mostrar(u); Portal.aoAtualizarUsuario = us => { mostrar(us); S.ro = !Portal.podeEditar('solicitacoes', us); render(); };
  const t = location.hash.slice(1); if (TABS.includes(t)) S.tab = t;
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  await carregar();
  const q = new URLSearchParams(location.search).get('abrir'); if (q) abrir(q);
})();
})();
