<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal Grupo GVC</title>
<link rel="icon" type="image/png" href="img/logo-gvc.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f7f5; --surface:#ffffff; --sunken:#edf1ee; --line:#d8dfda; --line-soft:#e6ebe7;
  --ink:#14211b; --ink-2:#4b5a52; --ink-3:#77857d;
  --accent:#1d6b52; --accent-ink:#ffffff; --accent-soft:#dcefe6; --plate:transparent; --plate-pad:0px;
  --warn:#a86400; --warn-bg:#fff3dc; --crit:#b42f2f; --crit-bg:#fde8e6; --ok:#1d7a3e; --ok-bg:#e2f4e7;
  --m-dest:#2a78d6; --m-mapa:#0f9e78; --m-frota:#b4690e;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --sunken:#1c2621; --line:#2c3a33; --line-soft:#233029;
  --ink:#e9efeb; --ink-2:#b2c0b8; --ink-3:#83938a;
  --accent:#4fb08c; --accent-ink:#06130d; --accent-soft:#1d3a2f; --plate:#eef3f0; --plate-pad:6px 10px;
  --warn:#e8a43a; --warn-bg:#33270f; --crit:#f07b74; --crit-bg:#3a1a19; --ok:#5cc47f; --ok-bg:#15301f;
  --m-dest:#5a9cf0; --m-mapa:#3cc79c; --m-frota:#e8a43a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --sunken:#1c2621; --line:#2c3a33; --line-soft:#233029;
  --ink:#e9efeb; --ink-2:#b2c0b8; --ink-3:#83938a;
  --accent:#4fb08c; --accent-ink:#06130d; --accent-soft:#1d3a2f; --plate:#eef3f0; --plate-pad:6px 10px;
  --warn:#e8a43a; --warn-bg:#33270f; --crit:#f07b74; --crit-bg:#3a1a19; --ok:#5cc47f; --ok-bg:#15301f;
  --m-dest:#5a9cf0; --m-mapa:#3cc79c; --m-frota:#e8a43a;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100vh}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px 20px;padding-block:12px;flex-wrap:wrap}
.brand-row{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.logos{display:flex;align-items:center;gap:10px;background:var(--plate);padding:var(--plate-pad);border-radius:6px;flex-shrink:0}
.logos img{display:block;width:auto}
.logos .l-retec{height:28px}.logos .l-gvc{height:32px}
.logos i{width:1px;align-self:stretch;background:var(--line);margin:2px 0}
.brand{display:flex;flex-direction:column;padding-left:14px;border-left:1px solid var(--line);min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.user-box{display:flex;align-items:center;gap:10px}
.user-box .who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.user-box .who b{font-weight:600}
.user-box .who span{font-size:12px;color:var(--ink-3)}
@media (max-width:560px){.logos .l-retec{height:22px}.logos .l-gvc{height:25px}.brand b{font-size:19px}.brand{padding-left:10px}.user-box .who{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:9px 14px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;min-height:38px}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.55;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:38px;width:100%}
label{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:4px}
.mono{font-family:var(--f-mono)}
.sub{color:var(--ink-3);margin:4px 0 0}
main{padding-block:24px 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h2{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:22px;margin:0}
.form{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.al{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}
.al.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.al.crit{border-left-color:var(--crit);background:var(--crit-bg)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:20px;padding:2px 8px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.off{background:var(--sunken);color:var(--ink-3)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}

/* login */
.login-logos{display:flex;justify-content:center;align-items:center;gap:22px;margin:24px auto 18px;width:max-content;max-width:100%}
.login-logos .l-retec{height:46px}.login-logos .l-gvc{height:54px}
.login-logos i{width:1px;height:44px;background:var(--line)}
.login{max-width:460px;margin:0 auto}

/* módulos */
.hello h1{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:28px;margin:0}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.mod{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:inherit;transition:border-color .15s, box-shadow .15s, transform .15s;overflow:hidden}
.mod::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
a.mod:hover{border-color:var(--c);box-shadow:0 8px 24px rgba(0,0,0,.07);transform:translateY(-1px)}
.mod .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.mod .ico svg{width:26px;height:26px}
.mod h3{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:20px;margin:0}
.mod p{margin:0;color:var(--ink-2);flex:1}
.mod .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mod .go{font-weight:600;color:var(--c)}
.mod.off{opacity:.6}
.mod.off .go{color:var(--ink-3)}

/* usuários */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:920px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;background:var(--sunken);padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line-soft);vertical-align:middle}
td select,td input{min-height:32px;padding:5px 8px;width:auto}
tr.inativo td{opacity:.55}
.nu{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;margin-top:16px}
@media (max-width:820px){.nu{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chk input{width:auto;min-height:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-3);font-size:12px;margin-top:10px}
</style>
<script src="config.js"></script>
<script src="portal.js?v=20261101"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand-row">
      <div class="logos" aria-label="Retec · Grupo GVC"><img class="l-retec" src="img/logo-retec.png" alt="Retec"><i></i><img class="l-gvc" src="img/logo-gvc.png" alt="Grupo GVC"></div>
      <div class="brand"><span>Grupo GVC</span><b>Portal</b></div>
    </div>
    <div class="user-box" id="user-box" hidden>
      <div class="who"><b id="u-nome"></b><span id="u-email"></span></div>
      <button class="btn sm" id="btn-usuarios" hidden>Usuários</button>
      <button class="btn sm" id="btn-historico" hidden>Histórico</button>
      <button class="btn sm" id="btn-sair">Sair</button>
    </div>
  </div>
</header>
<main class="wrap" id="main"><p class="sub">Carregando…</p></main>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const params = new URLSearchParams(location.search);
  const ICONES = {
    destinacao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h11v10H2zM13 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
    mapa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
    frota: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11l3 4v5H3z"/><path d="M14 8V5H3v3"/><circle cx="7" cy="18" r="2"/><circle cx="15" cy="18" r="2"/><path d="M19 12h2v5h-2"/></svg>',
  };
  const CORES = { destinacao: 'var(--m-dest)', mapa: 'var(--m-mapa)', frota: 'var(--m-frota)' };
  let usuario = null, usuarios = null, unidades = [], tela = 'home', histFiltros = {};

  function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); }
  function aviso(msg, tipo) {
    if (!msg) return '';
    const cls = tipo === 'ok' ? 'al ok' : tipo === 'crit' ? 'al crit' : 'al';
    const lbl = tipo === 'ok' ? 'Ok' : 'Atenção';
    return `<div class="${cls}"><span class="pill ${tipo === 'ok' ? 'ok' : 'warn'}">${lbl}</span><b>${esc(msg)}</b></div>`;
  }
  function mostrarUsuario() {
    $('#user-box').hidden = !usuario;
    if (!usuario) return;
    $('#u-nome').textContent = usuario.nome;
    $('#u-email').textContent = usuario.email;
    $('#btn-usuarios').hidden = !usuario.adminPortal;
    $('#btn-usuarios').textContent = tela === 'usuarios' ? '← Módulos' : 'Usuários';
    $('#btn-historico').hidden = !usuario.adminPortal;
    $('#btn-historico').textContent = tela === 'historico' ? '← Módulos' : 'Histórico';
  }

  /* ---------- login ---------- */
  function telaLogin(msg, modo, emailPre, tipoMsg) {
    usuario = null; mostrarUsuario();
    modo = modo || 'login';
    const email = emailPre || (Portal.sessao().usuario && Portal.sessao().usuario.email) || '';
    const av = aviso(msg, tipoMsg);
    let corpo;
    if (modo === 'login') corpo = `
      <h2>Entrar</h2><p class="sub" style="margin-bottom:16px">Use o seu e-mail e a senha que você criou. O mesmo acesso vale para todos os módulos.</p>${av}
      <form id="lg" class="form" autocomplete="on">
        <div><label for="lg-email">E-mail</label><input id="lg-email" type="email" required autocomplete="username" value="${esc(email)}"></div>
        <div><label for="lg-senha">Senha</label><input id="lg-senha" type="password" required autocomplete="current-password"></div>
        <div class="row" style="justify-content:space-between"><button class="btn pri" id="lg-btn">Entrar</button><button type="button" class="btn" id="lg-primeiro">Primeiro acesso ou esqueci a senha</button></div>
      </form>`;
    else if (modo === 'email') corpo = `
      <h2>Criar ou trocar a senha</h2><p class="sub" style="margin-bottom:16px">Vamos enviar um código de 6 dígitos para o seu e-mail. Ele precisa estar cadastrado por um administrador do portal.</p>${av}
      <form id="lg" class="form">
        <div><label for="lg-email">E-mail</label><input id="lg-email" type="email" required autocomplete="username" value="${esc(email)}"></div>
        <div class="row" style="justify-content:space-between"><button class="btn pri" id="lg-btn">Enviar código</button><button type="button" class="btn" id="lg-voltar">Voltar para o login</button></div>
      </form>`;
    else corpo = `
      <h2>Criar ou trocar a senha</h2><p class="sub" style="margin-bottom:16px">Digite o código que chegou em <b>${esc(email)}</b> (confira também o spam) e escolha sua senha.</p>${av}
      <form id="lg" class="form">
        <div><label for="lg-cod">Código recebido</label><input id="lg-cod" class="mono" inputmode="numeric" maxlength="6" required autocomplete="one-time-code"></div>
        <div><label for="lg-senha">Nova senha (mínimo 8 caracteres)</label><input id="lg-senha" type="password" minlength="8" required autocomplete="new-password"></div>
        <div><label for="lg-senha2">Repita a senha</label><input id="lg-senha2" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="row" style="justify-content:space-between"><button class="btn pri" id="lg-btn">Salvar senha e entrar</button><button type="button" class="btn" id="lg-reenviar">Enviar outro código</button></div>
      </form>`;
    $('#main').innerHTML = `<div class="login-logos"><img class="l-retec" src="img/logo-retec.png" alt="Retec"><i></i><img class="l-gvc" src="img/logo-gvc.png" alt="Grupo GVC"></div>
      <section class="panel login">${corpo}</section>`;
    const f = $('#lg'), btn = $('#lg-btn');
    const ocupado = (b, t) => { btn.disabled = b; if (t) btn.textContent = t; };
    if ($('#lg-primeiro')) $('#lg-primeiro').onclick = () => telaLogin('', 'email', $('#lg-email').value.trim());
    if ($('#lg-voltar')) $('#lg-voltar').onclick = () => telaLogin('', 'login', $('#lg-email').value.trim());
    if ($('#lg-reenviar')) $('#lg-reenviar').onclick = () => telaLogin('', 'email', email);
    f.onsubmit = async ev => {
      ev.preventDefault();
      try {
        if (modo === 'login') {
          ocupado(true, 'Entrando…');
          entrou(await Portal.api('login', { email: $('#lg-email').value.trim(), senha: $('#lg-senha').value }));
        } else if (modo === 'email') {
          ocupado(true, 'Enviando…'); const em = $('#lg-email').value.trim();
          await Portal.api('enviarCodigo', { email: em });
          telaLogin('Código enviado para ' + em + '.', 'codigo', em, 'ok');
        } else {
          const s1 = $('#lg-senha').value, s2 = $('#lg-senha2').value;
          if (s1 !== s2) { toast('As duas senhas não são iguais'); return; }
          ocupado(true, 'Salvando…');
          const j = await Portal.api('definirSenha', { email, codigo: $('#lg-cod').value.trim(), senha: s1 });
          toast('Senha criada'); entrou(j);
        }
      } catch (e) {
        if (modo === 'login' && e && e.erro === 'sem_senha') { telaLogin(e.mensagem, 'email', $('#lg-email').value.trim()); return; }
        ocupado(false, modo === 'login' ? 'Entrar' : modo === 'email' ? 'Enviar código' : 'Salvar senha e entrar');
        const old = f.querySelector('.al'); if (old) old.remove();
        f.insertAdjacentHTML('afterbegin', aviso((e && e.mensagem) || 'Não foi possível concluir. Tente de novo.'));
      }
    };
    const first = f.querySelector('input:not([value]),input[value=""]') || f.querySelector('input');
    try { first && first.focus(); } catch (e) {}
  }

  function entrou(j) {
    const s = Portal.sessao(); s.token = j.token; s.usuario = j.usuario; Portal.gravarSessao(s);
    usuario = j.usuario;
    const voltar = params.get('voltar');
    if (voltar && /^[a-z0-9\-]+\/?/i.test(voltar)) {
      const mod = voltar.split('/')[0];
      if (!Portal.MODULOS[mod] || (usuario.modulos || {})[mod]) { location.replace(Portal.RAIZ + voltar); return; }
    }
    history.replaceState(null, '', location.pathname);
    tela = 'home'; render();
  }

  /* ---------- módulos ---------- */
  function renderHome(msg, tipo) {
    const mods = Object.entries(Portal.MODULOS);
    const disp = mods.filter(([k]) => (usuario.modulos || {})[k]);
    const primeiro = String(usuario.nome || '').split(' ')[0];
    $('#main').innerHTML = `${aviso(msg, tipo)}
      <div class="hello"><h1>Olá, ${esc(primeiro)}</h1><p class="sub">${disp.length ? 'Escolha um módulo para abrir.' : 'Você ainda não tem acesso a nenhum módulo. Fale com um administrador do portal.'}</p></div>
      <div class="mods">${mods.map(([k, m]) => {
        const n = (usuario.modulos || {})[k];
        const tag = n ? 'a' : 'div';
        return `<${tag} class="mod${n ? '' : ' off'}" style="--c:${CORES[k] || 'var(--accent)'}" ${n ? `href="${esc(m.caminho)}"` : 'aria-disabled="true"'}>
          <div class="ico">${ICONES[k] || ''}</div>
          <h3>${esc(m.nome)}</h3>
          <p>${esc(m.desc)}</p>
          <div class="foot">${n ? `<span class="pill ok">${esc(Portal.NIVEIS[n])}</span><span class="go">Abrir →</span>` : '<span class="pill off">Sem acesso</span><span class="go">Peça acesso ao administrador</span>'}</div>
        </${tag}>`;
      }).join('')}</div>`;
  }

  /* ---------- usuários (admin do portal) ---------- */
  const optNivel = v => [['', 'Sem acesso'], ['leitor', 'Leitor'], ['editor', 'Editor'], ['admin', 'Administrador']]
    .map(([k, l]) => `<option value="${k}" ${k === (v || '') ? 'selected' : ''}>${l}</option>`).join('');
  async function carregarUsuarios() {
    try { const j = await Portal.api('listarUsuarios', {}); usuarios = j.usuarios; unidades = j.unidades || []; if (tela === 'usuarios') renderUsuarios(); }
    catch (e) { toast((e && e.mensagem) || 'Não consegui carregar os usuários'); }
  }
  // Unidades que a pessoa vê. Nenhuma marcada = todas.
  const chkUnidades = (pref, sel) => unidades.map(x => `<label class="chk" style="font-weight:500"><input type="checkbox" data-uni="${esc(x.id)}" ${(sel || []).includes(x.id) ? 'checked' : ''} id="${pref}-${esc(x.id)}"> ${esc(x.nome)}</label>`).join('');
  const lerUnidades = el => [...el.querySelectorAll('[data-uni]')].filter(c => c.checked).map(c => c.dataset.uni);
  function renderUsuarios() {
    if (!usuarios) { $('#main').innerHTML = '<p class="sub">Carregando usuários…</p>'; carregarUsuarios(); return; }
    const mods = Object.entries(Portal.MODULOS);
    const us = [...usuarios].sort((a, b) => (b.ativo - a.ativo) || a.nome.localeCompare(b.nome, 'pt-BR'));
    $('#main').innerHTML = `<section class="panel">
      <h2>Usuários e acessos</h2>
      <p class="sub">Para cada pessoa, escolha o nível em cada módulo: <b>Leitor</b> só vê, <b>Editor</b> lança e altera, <b>Administrador</b> também mexe nas configurações do módulo. <b>Admin do portal</b> cadastra usuários e vê o histórico geral. Em <b>Unidades</b>, marque a unidade da pessoa (programadora, frota e equipe são por unidade); sem nenhuma marcada, ela vê todas. Mudanças valem na hora, inclusive para quem já está conectado.</p>
      <form id="nu" class="nu">
        <div><label for="nu-email">E-mail</label><input id="nu-email" type="email" required></div>
        <div><label for="nu-nome">Nome</label><input id="nu-nome" required></div>
        ${mods.map(([k, m]) => `<div><label for="nu-${k}">${esc(m.nome)}</label><select id="nu-${k}">${optNivel(k === 'mapa' ? 'leitor' : 'editor')}</select></div>`).join('')}
        <div><label>Unidades</label><div id="nu-uni" class="row" style="gap:10px">${chkUnidades('nu-uni', [])}</div></div>
        <div><label class="chk"><input type="checkbox" id="nu-admin"> Admin do portal</label><button class="btn pri" id="nu-btn" style="margin-top:6px">Cadastrar</button></div>
      </form>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Nome</th><th>E-mail</th>${mods.map(([, m]) => `<th>${esc(m.nome)}</th>`).join('')}<th>Unidades</th><th>Admin do portal</th><th>Ativo</th><th>Senha</th><th>Último acesso</th><th></th></tr></thead>
        <tbody>${us.map(u => `<tr data-email="${esc(u.email)}" class="${u.ativo ? '' : 'inativo'}">
          <td><input data-k="nome" value="${esc(u.nome)}" style="width:170px" aria-label="Nome"></td>
          <td class="mono">${esc(u.email)}</td>
          ${mods.map(([k, m]) => `<td><select data-mod="${k}" aria-label="${esc(m.nome)}">${optNivel((u.modulos || {})[k])}</select></td>`).join('')}
          <td><div data-unis style="display:flex;flex-direction:column;gap:2px;min-width:120px">${chkUnidades('u-' + esc(u.email), u.unidades)}</div></td>
          <td><select data-k="admin" aria-label="Admin do portal"><option value="1" ${u.adminPortal ? 'selected' : ''}>Sim</option><option value="0" ${u.adminPortal ? '' : 'selected'}>Não</option></select></td>
          <td><select data-k="ativo" aria-label="Ativo"><option value="1" ${u.ativo ? 'selected' : ''}>Sim</option><option value="0" ${u.ativo ? '' : 'selected'}>Não</option></select></td>
          <td>${u.temSenha ? '<span class="pill ok">criada</span>' : '<span class="pill warn">aguardando 1º acesso</span>'}</td>
          <td>${esc(u.ultimoAcesso || '—')}</td>
          <td><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn sm pri" data-salvar hidden>Salvar</button>${u.temSenha ? '<span data-rz><button class="btn sm" data-reset>Apagar senha</button></span>' : ''}</div></td>
        </tr>`).join('')}</tbody>
      </table></div>
      <p class="sub" style="margin-top:12px">Depois de cadastrar, mande para a pessoa o link do portal: <b class="mono">${esc(Portal.RAIZ)}</b>. Ela clica em "Primeiro acesso", recebe um código no e-mail e cria a própria senha. "Apagar senha" desconecta a pessoa e faz ela criar uma senha nova.</p>
    </section>`;
    $('#nu').onsubmit = async e => {
      e.preventDefault(); const b = $('#nu-btn'); b.disabled = true;
      const modulos = {}; mods.forEach(([k]) => modulos[k] = $('#nu-' + k).value);
      try {
        await Portal.api('salvarUsuario', { usuario: { email: $('#nu-email').value.trim(), nome: $('#nu-nome').value.trim(), modulos, adminPortal: $('#nu-admin').checked, ativo: true, unidades: lerUnidades($('#nu-uni')) } });
        toast('Usuário cadastrado'); usuarios = null; renderUsuarios();
      } catch (er) { b.disabled = false; toast((er && er.mensagem) || 'Não foi possível cadastrar'); }
    };
    document.querySelectorAll('tr[data-email]').forEach(tr => {
      const email = tr.dataset.email; const sv = tr.querySelector('[data-salvar]');
      tr.querySelectorAll('[data-k],[data-mod],[data-uni]').forEach(x => x.oninput = x.onchange = () => sv.hidden = false);
      sv.onclick = async () => {
        sv.disabled = true;
        const modulos = {}; tr.querySelectorAll('[data-mod]').forEach(s => modulos[s.dataset.mod] = s.value);
        try {
          await Portal.api('salvarUsuario', { usuario: { email, nome: tr.querySelector('[data-k="nome"]').value.trim(), modulos,
            adminPortal: tr.querySelector('[data-k="admin"]').value === '1', ativo: tr.querySelector('[data-k="ativo"]').value === '1', unidades: lerUnidades(tr) } });
          toast('Usuário atualizado'); usuarios = null;
          if (email === usuario.email) { const j = await Portal.api('eu', {}); usuario = j.usuario; const s = Portal.sessao(); s.usuario = usuario; Portal.gravarSessao(s); }
          renderUsuarios();
        } catch (er) { sv.disabled = false; toast((er && er.mensagem) || 'Não foi possível salvar'); }
      };
      const rz = tr.querySelector('[data-rz]');
      if (rz) rz.querySelector('[data-reset]').onclick = () => {
        rz.innerHTML = 'Apagar? <button class="btn sm danger" data-sim>Sim</button> <button class="btn sm" data-nao>Não</button>';
        rz.querySelector('[data-nao]').onclick = () => renderUsuarios();
        rz.querySelector('[data-sim]').onclick = async () => {
          try { await Portal.api('resetarSenha', { email }); toast('Senha apagada. A pessoa vai criar outra no próximo acesso.'); usuarios = null; renderUsuarios(); }
          catch (er) { toast((er && er.mensagem) || 'Não foi possível apagar'); }
        };
      };
    });
  }

  /* ---------- histórico geral (admin do portal) ---------- */
  const NOMES_MOD = { mapa: 'Mapa Operacional', destinacao: 'Controle de Destinação', portal: 'Portal (usuários e acessos)' };
  const ACOES = { criou: 'Criou', alterou: 'Alterou', inativou: 'Inativou', reativou: 'Reativou', excluiu: 'Excluiu', entrou: 'Entrou no portal', 'registro antigo': 'Registro antigo', migrou: 'Migração' };
  let histDados = null;
  async function carregarHistorico() {
    $('#h-res').innerHTML = '<p class="sub" style="padding:14px">Carregando…</p>';
    try { histDados = await Portal.api('historico.geral', { filtros: histFiltros }); desenharHistorico(); }
    catch (e) { $('#h-res').innerHTML = `<p class="sub" style="padding:14px">${esc((e && e.mensagem) || 'Não consegui carregar o histórico.')}</p>`; }
  }
  function desenharHistorico() {
    const j = histDados; if (!j) return;
    const sel = $('#h-pessoa'); const atual = histFiltros.pessoa || '';
    sel.innerHTML = '<option value="">Todas</option>' + (j.pessoas || []).map(p => `<option ${p === atual ? 'selected' : ''}>${esc(p)}</option>`).join('');
    const cls = a => a === 'criou' ? 'ok' : (a === 'inativou' || a === 'excluiu') ? 'crit' : a === 'alterou' ? 'warn' : 'off';
    $('#h-res').innerHTML = j.itens.length ? `<div class="tbl-wrap" style="margin-top:0;border:0"><table>
      <thead><tr><th>Quando</th><th>Quem</th><th>Módulo</th><th>Registro</th><th>Ação</th><th>Campo</th><th>De</th><th>Para</th></tr></thead>
      <tbody>${j.itens.map(x => `<tr>
        <td class="mono" style="white-space:nowrap">${esc(Portal.dataHora(x.quando).replace(' às ', ' '))}</td>
        <td>${esc(x.nome || x.email)}</td><td>${esc(NOMES_MOD[x.modulo] || x.modulo || '—')}</td>
        <td><span class="mono" style="white-space:nowrap">${esc(x.registroId)}</span>${x.registroNome ? `<div class="sub" style="margin:0">${esc(x.registroNome)}</div>` : ''}</td>
        <td><span class="pill ${cls(x.acao)}">${esc(ACOES[x.acao] || x.acao)}</span></td>
        <td>${esc(x.campo)}${!x.campo && x.detalhe ? `<div class="sub" style="margin:0;max-width:360px">${esc(x.detalhe)}</div>` : ''}</td>
        <td>${esc(x.de)}</td><td>${esc(x.para)}</td></tr>`).join('')}</tbody></table></div>
      <p class="sub" style="padding:10px 14px">Mostrando ${j.itens.length} de ${j.total} alterações encontradas${j.total > j.itens.length ? ' (refine os filtros para ver as mais antigas)' : ''}.</p>`
      : '<p class="sub" style="padding:14px">Nenhuma alteração com esses filtros.</p>';
  }
  function renderHistorico() {
    const f = histFiltros;
    $('#main').innerHTML = `<section class="panel">
      <h2>Histórico geral</h2>
      <p class="sub">Tudo o que foi criado, alterado, inativado ou excluído em qualquer módulo, com quem fez e quando. Cada registro também tem o próprio botão "Histórico" dentro do módulo.</p>
      <form id="h-f" class="nu" style="margin-top:12px">
        <div><label for="h-de">De</label><input type="date" id="h-de" value="${esc(f.de || '')}"></div>
        <div><label for="h-ate">Até</label><input type="date" id="h-ate" value="${esc(f.ate || '')}"></div>
        <div><label for="h-mod">Módulo</label><select id="h-mod"><option value="">Todos</option>${Object.entries(NOMES_MOD).map(([k, n]) => `<option value="${k}" ${f.modulo === k ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
        <div><label for="h-pessoa">Pessoa</label><select id="h-pessoa"><option value="">Todas</option></select></div>
        <div><label for="h-reg">Registro</label><input id="h-reg" placeholder="Código ou nome, ex.: CAD-000012" value="${esc(f.registro || '')}"></div>
        <div><label class="chk"><input type="checkbox" id="h-acessos" ${f.acessos ? 'checked' : ''}> Incluir entradas no portal</label><button class="btn pri" style="margin-top:6px">Filtrar</button></div>
      </form>
      <div id="h-res" style="margin-top:14px;border:1px solid var(--line);border-radius:10px"></div>
    </section>`;
    $('#h-f').onsubmit = e => {
      e.preventDefault();
      histFiltros = { de: $('#h-de').value, ate: $('#h-ate').value, modulo: $('#h-mod').value, pessoa: $('#h-pessoa').value, registro: $('#h-reg').value.trim(), acessos: $('#h-acessos').checked };
      carregarHistorico();
    };
    if (histDados) desenharHistorico(); else carregarHistorico();
  }

  function render(msg, tipo) {
    mostrarUsuario();
    if (tela === 'usuarios' && usuario.adminPortal) renderUsuarios();
    else if (tela === 'historico' && usuario.adminPortal) renderHistorico();
    else { tela = 'home'; renderHome(msg, tipo); }
    mostrarUsuario();
  }

  $('#btn-sair').onclick = () => Portal.sair();
  $('#btn-usuarios').onclick = () => { tela = tela === 'usuarios' ? 'home' : 'usuarios'; if (tela === 'usuarios') usuarios = null; render(); };
  $('#btn-historico').onclick = () => { tela = tela === 'historico' ? 'home' : 'historico'; histDados = null; render(); };
  Portal.aoExpirar = () => telaLogin('Sua sessão terminou. Entre de novo.');

  async function start() {
    const s = Portal.sessao();
    const motivo = params.get('motivo');
    if (!s.token) { telaLogin(motivo === 'expirada' ? 'Sua sessão terminou. Entre de novo.' : ''); return; }
    try {
      const j = await Portal.api('eu', {});
      usuario = j.usuario; s.usuario = usuario; Portal.gravarSessao(s);
    } catch (e) {
      if (e && e.erro === 'nao_autenticado') return; // aoExpirar já mostrou o login
      if (!s.usuario) { telaLogin((e && e.mensagem) || 'Não consegui falar com o servidor.'); return; }
      usuario = s.usuario; // sem internet: mostra o último usuário conhecido
    }
    const sem = params.get('semAcesso');
    const voltar = params.get('voltar');
    if (voltar) { const mod = voltar.split('/')[0]; if (!Portal.MODULOS[mod] || (usuario.modulos || {})[mod]) { location.replace(Portal.RAIZ + voltar); return; } }
    history.replaceState(null, '', location.pathname);
    render(sem && Portal.MODULOS[sem] ? 'Você não tem acesso ao ' + Portal.MODULOS[sem].nome + '. Fale com um administrador do portal.' : '', 'warn');
  }
  start();
})();
</script>
</body>
</html>
