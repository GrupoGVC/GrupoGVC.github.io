<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mesmo visual do Controle de Destinação: barra fixa no topo (unidade + abas), conteúdo em painéis */
:root{
  --bg:#f5f7f5; --surface:#ffffff; --sunken:#edf1ee; --line:#d8dfda; --line-soft:#e6ebe7;
  --ink:#14211b; --ink-2:#4b5a52; --ink-3:#77857d;
  --accent:#1d6b52; --accent-ink:#ffffff; --accent-soft:#dcefe6; --plate:transparent; --plate-pad:0px;
  --s-dest:#2a78d6; --s-loc:#eb6834; --s-rec:#1baf7a;
  --warn:#a86400; --warn-bg:#fff3dc; --crit:#b42f2f; --crit-bg:#fde8e6; --ok:#1d7a3e; --ok-bg:#e2f4e7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --sunken:#1c2621; --line:#2c3a33; --line-soft:#233029;
  --ink:#e9efeb; --ink-2:#b2c0b8; --ink-3:#83938a;
  --accent:#4fb08c; --accent-ink:#06130d; --accent-soft:#1d3a2f; --plate:#eef3f0; --plate-pad:6px 10px;
  --s-dest:#3987e5; --s-loc:#d95926; --s-rec:#199e70;
  --warn:#e8a43a; --warn-bg:#33270f; --crit:#f07b74; --crit-bg:#3a1a19; --ok:#5cc47f; --ok-bg:#15301f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --sunken:#1c2621; --line:#2c3a33; --line-soft:#233029;
  --ink:#e9efeb; --ink-2:#b2c0b8; --ink-3:#83938a;
  --accent:#4fb08c; --accent-ink:#06130d; --accent-soft:#1d3a2f; --plate:#eef3f0; --plate-pad:6px 10px;
  --s-dest:#3987e5; --s-loc:#d95926; --s-rec:#199e70;
  --warn:#e8a43a; --warn-bg:#33270f; --crit:#f07b74; --crit-bg:#3a1a19; --ok:#5cc47f; --ok-bg:#15301f;
  color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px 0}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.brand-row{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.logos{display:flex;align-items:center;gap:10px;background:var(--plate);padding:var(--plate-pad);border-radius:6px;flex-shrink:0}
.logos img{display:block;width:auto}
.logos .l-retec{height:30px}.logos .l-gvc{height:34px}
.logos i{width:1px;align-self:stretch;background:var(--line);margin:2px 0}
.brand-row .brand{margin-right:0;padding-left:14px;border-left:1px solid var(--line)}
.login-logos{display:flex;justify-content:center;align-items:center;gap:22px;margin:28px auto 0;width:max-content;max-width:100%}
.login-logos .l-retec{height:48px}.login-logos .l-gvc{height:56px}
.login-logos i{height:44px}
@media (max-width:560px){.logos .l-retec{height:24px}.logos .l-gvc{height:27px}.brand-row{gap:10px}.brand-row .brand{padding-left:10px}.brand b{font-size:19px}.login-logos .l-retec{height:38px}.login-logos .l-gvc{height:44px}}
.month{display:flex;align-items:center;gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.month button{border:0;background:transparent;color:var(--ink-2);width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:16px}
.month button:hover{background:var(--surface);color:var(--ink)}
.month .lbl{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:16px;min-width:150px;text-align:center}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.on i{background:var(--ok)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;color:var(--ink-2);font:600 14px var(--f-body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .ct{font:500 11px var(--f-mono);background:var(--sunken);border-radius:10px;padding:1px 6px;margin-left:6px;color:var(--ink-2)}
nav.tabs button .ct.alert{background:var(--warn-bg);color:var(--warn)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:17px;margin:0;letter-spacing:.005em}
.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .k i{width:9px;height:9px;border-radius:2px;display:inline-block}
.kpi .v{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kpi.net{background:var(--sunken)}
.delta{font:500 11.5px var(--f-mono);padding:1px 5px;border-radius:3px}
.delta.up{background:var(--crit-bg);color:var(--crit)} .delta.dn{background:var(--ok-bg);color:var(--ok)}
.delta.rup{background:var(--ok-bg);color:var(--ok)} .delta.rdn{background:var(--crit-bg);color:var(--crit)}
/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;align-items:center;gap:10px;font-size:13px;cursor:default}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar .t{height:14px;background:var(--line-soft);border-radius:0 4px 4px 0;position:relative}
.bar .t span{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.bar .val{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:86px}
.bar:hover .n{color:var(--ink)}
.empty{color:var(--ink-3);font-size:13px;padding:14px 0}
/* trend */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--ink-3);font:11px var(--f-body)}
.chart-box{overflow-x:auto}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;background:var(--sunken);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--f-mono);font-size:12.5px}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--accent-soft)}
tfoot td{font-weight:600;background:var(--sunken);border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap}
.pill.custo{background:color-mix(in srgb,var(--s-dest) 15%,transparent);color:var(--s-dest)}
.pill.receita{background:color-mix(in srgb,var(--s-rec) 18%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.al.crit{border-left:4px solid var(--crit)} .al.warn{border-left:4px solid var(--warn)}
.al b{font-size:13.5px} .al .x{grid-column:2;color:var(--ink-2);font-size:12.5px}
.al .x code{font-family:var(--f-mono);font-size:12px;background:var(--sunken);padding:0 4px;border-radius:3px;cursor:pointer}
/* forms */
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
input.mono{font-family:var(--f-mono)}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--ink-3);min-height:16px}
.hint.warn{color:var(--warn)} .hint.crit{color:var(--crit)}
.calc{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters>*{flex:1 1 160px}
td input,td select{padding:5px 8px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.tip{position:fixed;pointer-events:none;z-index:30;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:4px;max-width:260px;line-height:1.4;white-space:pre-line}
.dest-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.dest-card h3{margin:0;font:700 15px var(--f-body)}
.price-row{display:grid;grid-template-columns:1fr 100px 32px;gap:6px}
.price-list{display:flex;flex-direction:column}
.price-ro{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.price-ro:last-child{border-bottom:0}
.dest-card a.btn,.panel-h a.btn{text-decoration:none}
.price-ro b{font-variant-numeric:tabular-nums;white-space:nowrap}.price-ro small{font-weight:400;color:var(--ink-2);margin-left:2px}
.notice{padding:14px 16px;border-radius:var(--r);background:var(--sunken);border:1px dashed var(--line);color:var(--ink-2)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.kpis{}@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.month .lbl{min-width:120px;font-size:15px}.kpi .v{font-size:23px}.bar{grid-template-columns:minmax(80px,38%) 1fr auto}}


.inp-btn{display:flex;gap:6px}.inp-btn input{flex:1;min-width:0}
.scan-btn{padding:0 10px!important;flex-shrink:0}
.scan-ov{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scan-box{background:var(--surface);border-radius:12px;padding:16px;width:min(100%,480px);display:flex;flex-direction:column;gap:12px}
#scan-cam{width:100%;min-height:220px;background:#000;border-radius:8px;overflow:hidden}
#scan-cam video{width:100%!important;display:block;border-radius:8px}
/* tipo de negócio */
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button,.seg label{border:0;background:transparent;color:var(--ink-2);font:600 13px var(--f-body);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.pill.neg-rss{background:color-mix(in srgb,var(--s-loc) 16%,transparent);color:var(--s-loc)}
.pill.neg-ind{background:color-mix(in srgb,var(--s-dest) 15%,transparent);color:var(--s-dest)}
.pill.neg-none{background:var(--warn-bg);color:var(--warn)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r);margin-bottom:12px;font-size:13px;color:var(--ink-2)}
/* ---------- celular ---------- */
nav.tabs .ic,nav.tabs .t-short{display:none}
.rt td.full,.rt td.strong-m{}

  body{font-size:15px}
  input,select,textarea{font-size:16px}
  header.top{position:static}
  .top-row{gap:8px;padding-block:10px 10px;flex-wrap:wrap}
  .brand-row{flex-basis:100%;gap:10px}

  .sync span{display:none}
  #u-nivel{display:none}
  #u-nome{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:2px;overflow:visible;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-bottom:0;border-radius:10px;font-size:11px;font-weight:600;position:relative}
  nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<style>
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{width:auto}
tr.inativo td{opacity:.55}
tr.inativo td:last-child{opacity:1}
.acoes{display:flex;gap:6px;justify-content:flex-end}
.tag-uni{font-size:11.5px;color:var(--ink-3)}
.sem-uni{font-size:11.5px;color:var(--warn);font-weight:600}
.cnh{font:600 12px var(--f-mono);background:var(--sunken);border-radius:4px;padding:1px 6px}
.form-panel{border-left:4px solid var(--accent)}
.uni-sel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}

.fat-box{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);font-size:13.5px}
table.docs td input,table.docs td select{min-width:110px}
.dlg-ov{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dlg h3{font:700 18px var(--f-display);font-stretch:85%;margin:0 0 12px}

<script>
(function () {
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = v => v === '' || v == null ? '—' : (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const D = iso => iso ? iso.split('-').reverse().join('/') : '';
const N = v => (+v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 4 });
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const arred = v => Math.round((+v || 0) * 100) / 100;
const NIVEL_LBL = { leitor: 'Leitor', editor: 'Editor', admin: 'Administrador' };
const TABS = ['afaturar', 'abertos', 'emitidas'];
const S = { tab: 'afaturar', d: null, ro: true, uni: '', busca: '', mes: null, cancelados: false, sel: {}, selc: {}, bm: null };

function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3600); }
function setSync(ok, txt) { const s = $('#sync'); s.classList.toggle('on', ok); s.querySelector('span').textContent = txt; }
function falha(e) { toast((e && e.mensagem) || 'Não foi possível salvar. Verifique a internet e tente de novo.'); }
const opts = (lista, sel, vazio) => (vazio !== undefined ? `<option value="">${esc(vazio)}</option>` : '') + lista.map(v => { const [val, lbl] = Array.isArray(v) ? v : [v, v]; return `<option value="${esc(val)}" ${String(val) === String(sel ?? '') ? 'selected' : ''}>${esc(lbl)}</option>`; }).join('');
function pedir(titulo, campos, okTxt) {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'dlg-ov';
    ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h3>${esc(titulo)}</h3>
      ${campos.map((c, i) => `<div class="fld"><label for="dlg-${i}">${esc(c.rotulo)}</label>${c.tipo === 'area' ? `<textarea id="dlg-${i}" rows="3">${esc(c.valor || '')}</textarea>` : `<input id="dlg-${i}" type="${c.tipo || 'text'}" value="${esc(c.valor ?? '')}" ${c.tipo === 'number' ? 'step="any"' : ''}>`}${c.dica ? `<div class="hint">${esc(c.dica)}</div>` : ''}</div>`).join('')}
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>${esc(okTxt || 'Confirmar')}</button></div></div>`;
    document.body.appendChild(ov);
    const fim = v => { ov.remove(); res(v); };
    ov.querySelector('[data-x]').onclick = () => fim(null);
    ov.onclick = e => { if (e.target === ov) fim(null); };
    ov.addEventListener('keydown', e => { if (e.key === 'Escape') fim(null); });
    ov.querySelector('[data-ok]').onclick = () => fim(campos.map((c, i) => ov.querySelector('#dlg-' + i).value.trim()));
    setTimeout(() => { const f = ov.querySelector('input,textarea'); if (f) f.focus(); }, 30);
  });
}

const cliDe = id => (S.d.clientes.find(c => c.id === id) || {});
const cliNome = id => cliDe(id).nome || '';
const uniNome = id => (S.d.todasUnidades.find(u => u.id === id) || {}).nome || '';
const conNome = id => (S.d.consultores.find(c => c.id === id) || {}).nome || '';
const resNome = id => (S.d.residuos.find(r => r.id === id) || {}).nome || '';
const solDe = id => S.d.solicitacoes.find(s => s.id === id) || {};
const passaUni = x => !S.uni || x.unidadeId === S.uni;
const passaBusca = txt => !S.busca || txt.toLowerCase().includes(S.busca.toLowerCase());
const stPill = st => `<span class="pill st ${{ 'BM enviado': 'fat', 'Aprovado': 'lib', 'NF emitida': 'nf', 'Cancelado': 'crit' }[st] || ''}">${esc(st)}</span>`;
const totalItens = itens => arred(itens.reduce((t, it) => t + (it.sentido === 'Desconto' ? -1 : 1) * arred((+it.quantidade || 0) * (+it.valorUnitario || 0)), 0));

async function carregar(silencioso) {
  if (!silencioso) setSync(false, 'Carregando…');
  try {
    S.d = await Portal.api('fat.dados', {});
    S.ro = !Portal.podeEditar('faturamento');
    setSync(true, (S.ro ? 'Somente leitura · ' : '') + 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
    montarUnidades(); render();
  } catch (e) {
    setSync(false, 'Sem conexão');
    if (!S.d) $('#main').innerHTML = `<section class="panel"><h2>Não consegui carregar o faturamento</h2><p class="sub">${esc((e && e.mensagem) || 'Verifique a internet.')}</p><div class="row" style="margin-top:10px"><button class="btn pri" id="tentar">Tentar de novo</button></div></section>`;
    const t = $('#tentar'); if (t) t.onclick = () => carregar();
  }
}
function montarUnidades() {
  const us = S.d.unidades; const box = $('#uni-box'), sel = $('#uni-sel');
  if (us.length <= 1) { box.hidden = true; S.uni = ''; return; }
  box.hidden = false; sel.innerHTML = opts([['', 'Todas'], ...us.map(u => [u.id, u.nome])], S.uni);
  sel.onchange = () => { S.uni = sel.value; render(); };
}
function setTab(t) {
  if (!TABS.includes(t)) t = 'afaturar';
  if (S.bm && S.bm.sujo && !confirm('Sair sem salvar o BM?')) return;
  S.tab = t; S.bm = null;
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  render(); scrollTo({ top: 0 });
}
$$('nav.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
// o servidor só manda as realizadas que já podem ir para o BM (destinação confirmada ou serviço sem destinação)
const prontaBm = s => s.status === 'Destinação' || s.status === 'Realizada';
// cliente que paga o transporte por km rodado: o solicitante escolhe o km (real ou previsto) antes do BM
const kmPend = s => !!(s && s.km && s.km.pendente);
// viagens frustradas (culpa do cliente) que o solicitante decidiu cobrar
const cobDe = id => (S.d.cobrancas || []).find(c => c.id === id) || {};
const cobLivres = () => (S.d.cobrancas || []).filter(c => c.decisao === 'Cobrar' && !c.noBm && passaUni(c));
const cobTxt = c => 'Viagem ' + (c.tipo === 'Frustrada' ? 'frustrada' : 'cancelada no dia') + ' em ' + D(c.data) + ' — ' + c.motivo;
const itemCob = c => ({ solicitacaoId: '', cobrancaId: c.id, precoClienteId: '', descricao: cobTxt(c), quantidade: 1, unidadeMedida: 'viagem', valorUnitario: +c.valor || 0, sentido: 'Cobrança' });
// itens do contrato (Mapa): transporte por viagem/km (por tipo de veículo), destinação/valorização (por resíduo), caixas
const TRANSP = ['Transporte por viagem', 'Transporte por km'];
const ehCaixa = p => /caixa/i.test(p.tipo || '');
const veiNome = id => ((S.d.tiposVeiculo || []).find(t => t.id === id) || {}).nome || '';
const veiSol = sid => (S.d.veiculoSol || {})[sid] || '';
// mesma regra do servidor: o do veículo, senão o de "qualquer veículo", senão o único; sem veículo e vários: só se forem do mesmo tipo
function transporteDaSol(s, precosS) {
  const ts = precosS.filter(p => TRANSP.includes(p.tipo)); if (!ts.length) return null;
  const v = veiSol(s.id);
  return (v && ts.find(p => p.tipoVeiculoId === v)) || ts.find(p => !p.tipoVeiculoId) || (ts.length === 1 ? ts[0] : null) || (!v && ts.every(p => p.tipo === ts[0].tipo) ? ts[0] : null);
}
// filial ligada à matriz com "fatura para a matriz": o BM/NF sai no CNPJ da matriz
const fatDe = id => { const c = cliDe(id); return c.principalId && c.faturaPara === 'principal' && cliDe(c.principalId).id ? c.principalId : id; };
// preço do contrato: só solicitação com perfil Contrato, vigente na data da solicitação; o do próprio cliente vem antes do da matriz
const usaContrato = s => !!s && s.perfil === 'Contrato';
const dataRefSol = s => s.dataSolicitacao || s.dataDesejada || s.dataColeta || hojeISO();
const chavePreco = p => [p.tipo, p.tipoVeiculoId || '', p.residuoId || '', p.capacidade === '' || p.capacidade == null ? '' : +p.capacidade].join('|');
function precosDaSol(s) {
  if (!usaContrato(s)) return [];
  const c = cliDe(s.clienteId); const ids = [s.clienteId, c.principalId].filter(Boolean); const d = dataRefSol(s);
  const vig = S.d.precos.filter(p => ids.includes(p.cadastroId) && (!p.vigenciaInicio || p.vigenciaInicio <= d) && (!p.vigenciaFim || p.vigenciaFim >= d))
    .sort((a, b) => ids.indexOf(a.cadastroId) - ids.indexOf(b.cadastroId) || String(b.vigenciaInicio).localeCompare(String(a.vigenciaInicio)));
  const vistos = {}; return vig.filter(p => { const k = chavePreco(p); if (vistos[k]) return false; vistos[k] = 1; return true; });
}
// caixas: item do contrato pela capacidade; entrega/retirada sem item próprio são cobradas como troca, se houver
const cxItem = (precosS, tipo, cap) => precosS.find(p => p.tipo === tipo && +p.capacidade === +cap);
function itensCaixaDaColeta(sid, precosS, dc) {
  const out = []; let inclusa = false;
  ((S.d.caixasSol || {})[sid] || []).forEach(m => {
    const linha = (it, cxs) => { out.push({ solicitacaoId: sid, precoClienteId: it.id, descricao: itemDesc(it) + ' · ' + cxs + (dc ? ' (' + dc + ')' : ''), quantidade: 1, unidadeMedida: it.un, valorUnitario: it.valor, sentido: 'Cobrança' }); if (it.tipo === 'Troca de caixa' && it.destinacaoInclusa) inclusa = true; };
    const nE = m.entregue ? 'caixa ' + m.entregue.numero : '', nR = m.retirada ? 'caixa ' + m.retirada.numero : '';
    if (m.entregue && m.retirada) {
      const tr = cxItem(precosS, 'Troca de caixa', m.retirada.capacidade) || cxItem(precosS, 'Troca de caixa', m.entregue.capacidade);
      if (tr) return linha(tr, 'entregou ' + nE + ', retirou ' + nR);
      const e = cxItem(precosS, 'Entrega de caixa', m.entregue.capacidade), r = cxItem(precosS, 'Retirada de caixa', m.retirada.capacidade);
      if (e) linha(e, 'entregou ' + nE); if (r) linha(r, 'retirou ' + nR); return;
    }
    if (m.entregue) { const it = cxItem(precosS, 'Entrega de caixa', m.entregue.capacidade) || cxItem(precosS, 'Troca de caixa', m.entregue.capacidade); if (it) linha(it, 'entregou ' + nE); }
    if (m.retirada) { const it = cxItem(precosS, 'Retirada de caixa', m.retirada.capacidade) || cxItem(precosS, 'Troca de caixa', m.retirada.capacidade); if (it) linha(it, 'retirou ' + nR); }
  });
  return { itens: out, inclusa };
}
const propostaDe = sid => (S.d.precosSol || []).filter(p => p.solicitacaoId === sid && p.origem === 'Proposta').sort((a, b) => a.ordem - b.ordem);
/** Aluguel das caixas no mês (clientes que faturam neste CNPJ): mês cheio = 1; proporcional = dias no cliente ÷ dias do mês. */
function aluguelDoMes(clienteId, mes) {
  const [y, m] = mes.split('-').map(Number); const ini = mes + '-01'; const dm = new Date(y, m, 0).getDate(); const fim = mes + '-' + String(dm).padStart(2, '0');
  const dias = (a, z) => Math.round((Date.UTC(+z.slice(0, 4), +z.slice(5, 7) - 1, +z.slice(8)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8))) / 864e5) + 1;
  const itens = [], semItem = [], semData = [];
  (S.d.permanencias || []).filter(pp => fatDe(pp.clienteId) === clienteId).forEach(pp => {
    const a = !pp.inicio || pp.inicio < ini ? ini : pp.inicio, z = !pp.fim || pp.fim > fim ? fim : pp.fim;
    if (a > z) return;
    const it = precosDaSol({ id: '', clienteId: pp.clienteId, perfil: 'Contrato', dataSolicitacao: ini }).find(p => p.tipo === 'Aluguel de caixa' && +p.capacidade === +pp.capacidade);
    if (!it) { semItem.push(pp.numero); return; }
    if (!pp.inicio) semData.push(pp.numero);
    const n = dias(a, z);
    itens.push({ solicitacaoId: '', precoClienteId: it.id, descricao: itemDesc(it) + ' · caixa ' + pp.numero + ' · ' + D(a) + ' a ' + D(z) + ' (' + n + ' dia(s))' + (pp.clienteId !== clienteId ? ' · ' + cliNome(pp.clienteId) : ''),
      quantidade: it.cobrancaAluguel === 'Mês cheio' ? 1 : Math.round(n / dm * 10000) / 10000, unidadeMedida: 'mês', valorUnitario: it.valor, sentido: 'Cobrança', _uni: pp.unidadeId });
  });
  return { itens, semItem, semData };
}
const temAluguel = cid => (S.d.permanencias || []).some(pp => fatDe(pp.clienteId) === cid && (S.d.precos || []).some(p => p.tipo === 'Aluguel de caixa' && (p.cadastroId === pp.clienteId || p.cadastroId === cliDe(pp.clienteId).principalId)));
const mesAnterior = () => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const kmTxt = k => 'km ' + (k.escolha === 'Real' ? 'real' : 'previsto') + (k.definidoPor ? ', definido por ' + k.definidoPor + (k.definidoEm ? ' em ' + D(k.definidoEm) : '') : '');
function render() {
  if (!S.d) return;
  const afat = S.d.solicitacoes.filter(s => prontaBm(s) && passaUni(s)).concat(cobLivres());
  const abertos = S.d.faturamentos.filter(f => (f.status === 'BM enviado' || f.status === 'Aprovado') && passaUni(f));
  $('#ct-af').textContent = afat.length; $('#ct-ab').textContent = abertos.length;
  if (S.bm) return renderBM();
  ({ afaturar: renderAFaturar, abertos: renderAbertos, emitidas: renderEmitidas })[S.tab]();
}

/* ---------- A faturar: realizadas sem BM, por cliente ---------- */
const FMT_R = '"R$" #,##0.00';
const valorFat = f => +(f.nfValor !== '' ? f.nfValor : f.bmValor) || 0;
const nfTxt = f => f.nfNumero || f.nfData ? (f.nfNumero || 's/nº') + (f.nfData ? ' · ' + D(f.nfData) : '') : '';
const COLS_FAT = [
  { k: 'bm', label: 'BM', v: f => f.bmNumero || 's/nº', cls: 'mono', h: f => `<b>${esc(f.bmNumero || 's/nº')}</b>${f.origem === 'planilha' ? ' <span class="tag-imp">planilha</span>' : ''}` },
  { k: 'cli', label: 'Cliente', v: f => cliNome(f.clienteId), cls: 'full', h: f => { const c = cliDe(f.clienteId); return `<b>${esc(c.nome || '—')}</b>${c.codigoUplog ? ` <span class="mono sub">${esc(c.codigoUplog)}</span>` : ''}`; } },
  { k: 'uni', label: 'Unidade', v: f => uniNome(f.unidadeId) },

        const v = arred((+it.quantidade || 0) * (+it.valorUnitario || 0));
        const cel = tr.querySelector('[data-v]'); cel.textContent = (it.sentido === 'Desconto' ? '− ' : '') + R(v); cel.classList.toggle('neg', it.sentido === 'Desconto');
        $('#bm-total').innerHTML = '<b>' + R(totalItens(b.itens)) + '</b>';
        const qc = tr.querySelector('[data-f="quantidade"]').parentNode; const av = qc.querySelector('.km-av'); if (av) av.remove(); qc.insertAdjacentHTML('beforeend', kmAviso(it));
      };
    });
  });
  $$('[data-rm]').forEach(x => x.onclick = () => { b.itens.splice(+x.dataset.rm, 1); marcar(); renderBM(); });
  $('#it-livre').onclick = () => { b.itens.push({ solicitacaoId: b.solIds[0] || '', precoClienteId: '', descricao: '', quantidade: 1, unidadeMedida: 'un', valorUnitario: 0, sentido: 'Cobrança' }); marcar(); renderBM(); };
  const sg = $('#it-sugerir'); if (sg) sg.onclick = () => {
    const dest = S.d.destinacao || {};
    const novos = [];
    let nProp = 0, semVei = 0;
    b.solIds.forEach(sid => {
      const d = dest[sid] || { viagens: 0, kg: {} }; const dc = D(solDe(sid).dataColeta);
      const sk = solDe(sid).km;
      const sol = solDe(sid);
      if (!usaContrato(sol)) { // proposta: os itens aprovados, com o peso e as viagens reais quando houver
        const pl = propostaDe(sid); if (!pl.length) { nProp++; return; }
        pl.forEach(p => { let q = +p.quantidade || 0;
          if (p.tipo === 'Transporte por viagem' && d.viagens) q = d.viagens;
          if ((p.tipo === 'Destinação' || p.tipo === 'Valorização') && +(d.kg[p.residuoId] || 0) > 0) q = Math.round(+d.kg[p.residuoId] * 1000) / 1000;
          novos.push({ solicitacaoId: sid, precoClienteId: '', descricao: itemDesc(p) + ' · proposta' + (sol.propostaNumero ? ' ' + sol.propostaNumero : '') + (dc ? ' (' + dc + ')' : ''), quantidade: q, unidadeMedida: p.un || 'un', valorUnitario: p.valorUnitario, sentido: p.tipo === 'Valorização' ? 'Desconto' : 'Cobrança' }); });
        return;
      }
      const precosS = precosDaSol(sol);
      const tr = transporteDaSol(sol, precosS);
      if (tr && tr.tipo === 'Transporte por km') {
        if (sk && sk.escolha) novos.push({ solicitacaoId: sid, precoClienteId: tr.id, descricao: itemDesc(tr) + ' · ' + kmTxt(sk) + (dc ? ' (' + dc + ')' : ''), quantidade: +sk.kmCobrado || 0, unidadeMedida: 'km', valorUnitario: tr.valor, sentido: 'Cobrança' });
      } else if (tr) novos.push({ solicitacaoId: sid, precoClienteId: tr.id, descricao: itemDesc(tr) + (dc ? ' (' + dc + ')' : ''), quantidade: d.viagens || 1, unidadeMedida: 'viagem', valorUnitario: tr.valor, sentido: 'Cobrança' });
      else if (precosS.some(p => TRANSP.includes(p.tipo))) semVei++;
      const cx = itensCaixaDaColeta(sid, precosS, dc); cx.itens.forEach(x => novos.push(x));
      precosS.filter(p => p.tipo === 'Destinação' || p.tipo === 'Valorização').forEach(p => {
        if (cx.inclusa && p.tipo === 'Destinação') return; // destinação inclusa na troca da caixa
        const kg = +(d.kg[p.residuoId] || 0);
        if (kg > 0) novos.push({ solicitacaoId: sid, precoClienteId: p.id, descricao: itemDesc(p) + (dc ? ' (' + dc + ')' : ''), quantidade: Math.round(kg * 1000) / 1000, unidadeMedida: 'kg', valorUnitario: p.valor, sentido: p.tipo === 'Valorização' ? 'Desconto' : 'Cobrança' });
      });
    });
    if (!novos.length) { toast(nProp === b.solIds.length ? 'As coletas deste BM são de proposta sem itens registrados: informe os valores da proposta.' : 'Nada para sugerir: a tabela de preço não bate com os resíduos lançados na Programação.'); return; }
    const deCob = b.itens.filter(it => it.cobrancaId), outros = b.itens.filter(it => !it.cobrancaId);
    if (outros.length && !confirm('Trocar os ' + outros.length + ' item(ns) atuais pelos ' + novos.length + ' sugeridos? (as viagens frustradas ficam)')) return;
    b.itens = novos.concat(deCob); marcar(); renderBM(); toast(novos.length + ' item(ns) sugerido(s)' + (nProp ? ' · ' + nProp + ' coleta(s) de proposta sem itens ficaram de fora' : '') + (semVei ? ' · ' + semVei + ' coleta(s) sem transporte: o veículo não tem preço no contrato' : '') + '. Confira e salve.');
  };
  const pa = $('#it-preco-add'); if (pa) pa.onclick = () => {
    const p = precos.find(x => x.id === $('#it-preco').value); if (!p) return;
    const sol = b.solIds[0] || '';
    let msg = 'Item incluído.';
    if (p.tipo === 'Transporte por km') {
      (b.solIds.length ? b.solIds : ['']).forEach(sid => { const k = (sid && solDe(sid).km) || {}; b.itens.push({ solicitacaoId: sid, precoClienteId: p.id, descricao: itemDesc(p) + ' · ' + (k.escolha ? kmTxt(k) : 'km rodado') + (sid && solDe(sid).dataColeta ? ' (' + D(solDe(sid).dataColeta) + ')' : ''), quantidade: +k.kmCobrado || 0, unidadeMedida: 'km', valorUnitario: p.valor, sentido: 'Cobrança' }); });
    } else if (p.tipo === 'Destinação' || p.tipo === 'Valorização') {
      const kgLanc = b.solIds.reduce((t, sid) => t + +(((S.d.destinacao || {})[sid] || { kg: {} }).kg[p.residuoId] || 0), 0);
      b.itens.push({ solicitacaoId: sol, precoClienteId: p.id, descricao: itemDesc(p), quantidade: Math.round(kgLanc * 1000) / 1000, unidadeMedida: 'kg', valorUnitario: p.valor, sentido: p.tipo === 'Valorização' ? 'Desconto' : 'Cobrança' });
      if (!kgLanc) msg = 'Item incluído: informe a quantidade em kg.';
    } else {
      b.itens.push({ solicitacaoId: sol, precoClienteId: p.id, descricao: itemDesc(p), quantidade: 1, unidadeMedida: p.un || 'un', valorUnitario: p.valor, sentido: 'Cobrança' });
      if (ehCaixa(p)) msg = 'Item incluído: confira a quantidade (' + p.un + ').';
    }
    marcar(); renderBM(); toast(msg);
  };
  const al = $('#al-add'); if (al) al.onclick = () => {
    const mes = $('#al-mes').value; if (!mes) return; b.alMes = mes;
    const r = aluguelDoMes(b.clienteId, mes);
    if (!r.itens.length) { toast(r.semItem.length ? 'Caixas sem item de aluguel no contrato para a capacidade: ' + r.semItem.join(', ') + '.' : 'Nenhuma caixa no cliente neste mês.'); return; }
    if (!b.unidadeId) b.unidadeId = r.itens[0]._uni || '';
    r.itens.forEach(x => { delete x._uni; b.itens.push(x); });
    marcar(); renderBM(); toast(r.itens.length + ' caixa(s) com aluguel em ' + mes.split('-').reverse().join('/') + (r.semData.length ? ' · sem data de entrega (contado desde o início do mês): ' + r.semData.join(', ') : '') + (r.semItem.length ? ' · sem item de aluguel: ' + r.semItem.join(', ') : '') + '.');
  };
  $('#bm-fechar').onclick = () => { if (b.sujo && !confirm('Fechar sem salvar o BM?')) return; S.bm = null; render(); };
  const h = $('#bm-hist'); if (h) h.onclick = () => Portal.mostrarHistorico('Faturamentos', b.id, 'BM ' + (b.bmNumero || 's/nº') + ' · ' + cliNome(b.clienteId));
  $('#bm-salvar').onclick = async ev => {
    const zero = b.itens.find(it => !(+it.quantidade > 0)); if (zero) { toast('Informe a quantidade de todos os itens (' + (zero.descricao || 'item sem descrição') + ').'); return; }
    ev.target.disabled = true;
    try { await Portal.api('fat.salvar', { registro: { id: b.id || '', clienteId: b.clienteId, unidadeId: b.unidadeId || '', bmNumero: b.bmNumero, bmData: b.bmData, obs: b.obs, itens: b.itens } });
      toast(b.id ? 'BM atualizado' : 'BM registrado'); b.solIds.forEach(id => delete S.sel[id]); (b.cobIds || []).forEach(id => delete S.selc[id]); S.bm = null; S.tab = 'abertos'; setTab('abertos'); await carregar(true); }
    catch (e) { ev.target.disabled = false; falha(e); }
  };
}

/* ---------- BMs em aberto ---------- */
function linhaFat(f, acoes, T) {
  return `<tr>${T.celulas(f)}<td data-label="">${acoes(f)}</td></tr>`;
}
function renderAbertos() {
  const lista = S.d.faturamentos.filter(f => (f.status === 'BM enviado' || f.status === 'Aprovado') && passaUni(f) && passaBusca([cliNome(f.clienteId), cliDe(f.clienteId).codigoUplog, f.bmNumero].join(' ')))
    .sort((a, b) => String(a.bmData).localeCompare(String(b.bmData)));
  const T = Portal.tabela('fat-abertos', COLS_FAT, { titulo: 'BMs enviados — aguardando aprovação e NF', aba: 'BMs enviados', arquivo: 'faturamento-bms-enviados', unidade: 'BMs', aoMudar: render, extrasExport: EXTRAS_FAT,
    subtitulo: () => S.uni ? 'Unidade: ' + uniNome(S.uni) : '', filtrosExtras: () => [S.busca && 'Busca: "' + S.busca + '"'].filter(Boolean),
    totais: l => ({ 'Valor': l.reduce((t, f) => t + valorFat(f), 0) }) });
  const listaTela = lista; const listaF = T.aplicar(listaTela);
  const total = listaF.reduce((t, f) => t + (+f.bmValor || 0), 0);
  $('#main').innerHTML = `<section class="panel">
    <div class="panel-h"><div><h2>BMs enviados — aguardando aprovação e NF</h2><p class="sub">Quando o cliente aprovar por e-mail, registre a aprovação. Ao emitir a NF, registre número e data: isso encerra o processo.</p></div></div>
    <div class="toolbar"><input type="search" id="busca" placeholder="Buscar cliente, código ou nº do BM…" value="${esc(S.busca)}" aria-label="Buscar"><span class="sub" style="margin:0 0 0 auto">${listaF.length} BM(s) · ${R(total)}</span>${T.botao()}</div>
    ${T.info(listaF.length, listaTela.length)}
    ${lista.length ? `<div class="tbl-wrap rtw"><table class="rt"><thead>${T.cab('<th></th>')}</thead><tbody>
      ${listaF.map(f => linhaFat(f, x => `<div class="acoes">${S.ro ? `<button class="btn sm" data-ver="${x.id}">Ver</button>` : `<button class="btn sm" data-ed="${x.id}">Editar</button>${x.status === 'BM enviado' ? `<button class="btn sm" data-apr="${x.id}">Aprovado</button>` : ''}<button class="btn sm pri" data-nf="${x.id}">Emitir NF</button><button class="btn sm danger" data-canc="${x.id}">Cancelar</button>`}</div>`, T)).join('') || `<tr><td colspan="${T.nVis() + 1}" class="empty">Nenhum BM com os filtros das colunas.</td></tr>`}
    </tbody></table></div>` : '<div class="empty">Nenhum BM aguardando.</div>'}
  </section>`;
  ligarBusca(); ligarAcoesFat(); T.ligar();
}
function renderEmitidas() {
  const meses = [...new Set(S.d.faturamentos.filter(f => f.status === 'NF emitida').map(f => (f.nfData || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  if (S.mes === null) S.mes = meses[0] || '';
  const lista = S.d.faturamentos.filter(f => (f.status === 'NF emitida' || (S.cancelados && f.status === 'Cancelado')) && passaUni(f) &&
    (!S.mes || (f.nfData || f.bmData || '').startsWith(S.mes)) && passaBusca([cliNome(f.clienteId), cliDe(f.clienteId).codigoUplog, f.bmNumero, f.nfNumero].join(' ')))
    .sort((a, b) => String(b.nfData).localeCompare(String(a.nfData)));
  const T = Portal.tabela('fat-emitidas', COLS_FAT, { titulo: 'NFs emitidas', arquivo: 'faturamento-nfs-emitidas', unidade: 'NFs', aoMudar: render, extrasExport: EXTRAS_FAT,
    subtitulo: () => [S.uni ? 'Unidade: ' + uniNome(S.uni) : '', S.mes ? 'Mês da NF: ' + S.mes.split('-').reverse().join('/') : 'Todos os meses'].filter(Boolean).join(' · '),
    filtrosExtras: () => [S.busca && 'Busca: "' + S.busca + '"', S.cancelados && 'Inclui cancelados'].filter(Boolean),
    totais: l => ({ 'Valor': l.filter(f => f.status === 'NF emitida').reduce((t, f) => t + valorFat(f), 0) }) });
  const listaTela = lista; const listaF = T.aplicar(listaTela);
  const total = listaF.filter(f => f.status === 'NF emitida').reduce((t, f) => t + (+(f.nfValor !== '' ? f.nfValor : f.bmValor) || 0), 0);
  const admin = Portal.nivel('faturamento') === 'admin';
  $('#main').innerHTML = `<section class="panel">
    <div class="panel-h"><div><h2>NFs emitidas</h2><p class="sub">Processo encerrado. Escolha o mês da NF ou busque por cliente, BM ou NF.</p></div></div>
    <div class="toolbar"><select id="f-mes" style="width:auto" aria-label="Mês da NF">${opts(meses.map(m => [m, m.split('-').reverse().join('/')]), S.mes, 'Todos os meses')}</select>
      <input type="search" id="busca" placeholder="Buscar cliente, BM, NF…" value="${esc(S.busca)}" aria-label="Buscar">
      <label class="chk"><input type="checkbox" id="canc" ${S.cancelados ? 'checked' : ''}> Mostrar cancelados</label>
      <span class="sub" style="margin:0 0 0 auto">${listaF.length} NF(s) · ${R(total)}</span>${T.botao()}</div>
    ${T.info(listaF.length, listaTela.length)}
    ${lista.length ? `<div class="tbl-wrap rtw"><table class="rt"><thead>${T.cab('<th></th>')}</thead><tbody>
      ${listaF.map(f => linhaFat(f, x => `<div class="acoes"><button class="btn sm" data-ver="${x.id}">Ver</button>${admin && x.status === 'NF emitida' ? `<button class="btn sm" data-reab="${x.id}">Reabrir</button><button class="btn sm danger" data-canc="${x.id}">Cancelar</button>` : ''}</div>`, T)).join('') || `<tr><td colspan="${T.nVis() + 1}" class="empty">Nenhuma NF com os filtros das colunas.</td></tr>`}
    </tbody></table></div>` : '<div class="empty">Nenhuma NF neste filtro.</div>'}
  </section>`;
  ligarBusca(); ligarAcoesFat(); T.ligar();
  $('#f-mes').onchange = e => { S.mes = e.target.value; render(); };
  $('#canc').onchange = e => { S.cancelados = e.target.checked; render(); };
}
function ligarBusca() { const b = $('#busca'); if (b) b.oninput = () => { S.busca = b.value; const pos = b.selectionStart; render(); const nb = $('#busca'); nb.focus(); nb.setSelectionRange(pos, pos); }; }
function verBM(f) {
  const c = cliDe(f.clienteId);
  const ov = document.createElement('div'); ov.className = 'dlg-ov';
  ov.innerHTML = `<div class="dlg" style="max-width:760px" role="dialog" aria-modal="true"><h3>BM ${esc(f.bmNumero || 's/nº')} · ${esc(c.nome)}</h3>
    <p class="sub">${stPill(f.status)} Envio ${esc(D(f.bmData) || '—')} · Aprovação ${esc(D(f.aprovacaoData) || '—')} · NF ${esc(f.nfNumero || '—')} ${f.nfData ? 'de ' + esc(D(f.nfData)) : ''}${f.motivo ? ' · Motivo: ' + esc(f.motivo) : ''}</p>
    <div class="tbl-wrap"><table><thead><tr><th>Coleta</th><th>Descrição</th><th class="num">Qtd</th><th>Un.</th><th class="num">Unit.</th><th class="num">Valor</th></tr></thead><tbody>
    ${f.itens.map(i => `<tr><td class="mono">${esc(D(solDe(i.solicitacaoId).dataColeta))}</td><td>${esc(i.descricao)}</td><td class="num">${N(i.quantidade)}</td><td>${esc(i.unidadeMedida)}</td><td class="num">${R(i.valorUnitario)}</td><td class="num ${i.sentido === 'Desconto' ? 'neg' : ''}">${i.sentido === 'Desconto' ? '− ' : ''}${R(i.valor)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="5">Total do BM${f.nfValor !== '' && +f.nfValor !== +f.bmValor ? ' (NF: ' + R(f.nfValor) + ')' : ''}</td><td class="num"><b>${R(f.bmValor)}</b></td></tr></tfoot></table></div>
    ${f.obs ? `<p class="sub">${esc(f.obs)}</p>` : ''}<div class="gvc-audit" style="margin-top:10px">${Portal.auditoriaHTML(f)}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px;gap:8px"><button class="btn" data-h>Histórico</button><button class="btn pri" data-x>Fechar</button></div></div>`;
  document.body.appendChild(ov);
  const fim = () => ov.remove();
  ov.querySelector('[data-x]').onclick = fim; ov.onclick = e => { if (e.target === ov) fim(); };
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') fim(); });
  ov.querySelector('[data-h]').onclick = () => { fim(); Portal.mostrarHistorico('Faturamentos', f.id, 'BM ' + (f.bmNumero || 's/nº') + ' · ' + c.nome); };
  ov.querySelector('[data-x]').focus();
}
function ligarAcoesFat() {
  const achar = id => S.d.faturamentos.find(f => f.id === id);
  const acao = async (id, tipo, dados, msg) => { try { await Portal.api('fat.acao', { id, tipo, dados }); toast(msg); await carregar(true); } catch (e) { falha(e); } };
  $$('[data-ver]').forEach(b => b.onclick = () => verBM(achar(b.dataset.ver)));
  $$('[data-ed]').forEach(b => b.onclick = () => editarBM(achar(b.dataset.ed)));
  $$('[data-apr]').forEach(b => b.onclick = async () => { const v = await pedir('Cliente aprovou o BM', [{ rotulo: 'Data da aprovação (e-mail do cliente)', tipo: 'date', valor: hojeISO() }], 'Registrar aprovação'); if (v) acao(b.dataset.apr, 'aprovar', { aprovacaoData: v[0] }, 'Aprovação registrada'); });
  $$('[data-nf]').forEach(b => b.onclick = async () => { const f = achar(b.dataset.nf);
    const v = await pedir('Emitir NF · BM ' + (f.bmNumero || 's/nº'), [{ rotulo: 'Nº da NF' }, { rotulo: 'Data de emissão', tipo: 'date', valor: hojeISO() }, { rotulo: 'Valor da NF (R$)', tipo: 'number', valor: f.bmValor, dica: 'Valor do BM: ' + R(f.bmValor) }], 'Registrar NF');
    if (v) acao(f.id, 'nf', { nfNumero: v[0], nfData: v[1], nfValor: v[2] }, 'NF registrada — processo encerrado'); });
  $$('[data-canc]').forEach(b => b.onclick = async () => { const v = await pedir('Cancelar BM', [{ rotulo: 'Motivo', tipo: 'area', dica: 'As coletas voltam para "Destinadas — falta BM".' }], 'Cancelar BM'); if (v) acao(b.dataset.canc, 'cancelar', { motivo: v[0] }, 'BM cancelado'); });
  $$('[data-reab]').forEach(b => b.onclick = () => { if (confirm('Reabrir este BM? A NF registrada continua no histórico; o BM volta para "Aprovado".')) acao(b.dataset.reab, 'reabrir', {}, 'BM reaberto'); });
}

$('#btn-sair').onclick = () => Portal.sair();
$('#btn-atualizar').onclick = () => carregar();
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== S.tab) setTab(t); });
window.addEventListener('beforeunload', e => { if (S.bm && S.bm.sujo) { e.preventDefault(); e.returnValue = ''; } });
(async function start() {
  let u;
  try { u = await Portal.exigir('faturamento'); }
  catch (e) { $('#main').innerHTML = `<section class="panel"><h2>Não consegui falar com o portal</h2><p class="sub">${esc((e && e.mensagem) || '')}</p></section>`; return; }
  const mostrar = us => { $('#u-box').hidden = false; $('#btn-atualizar').hidden = false; $('#u-nome').textContent = us.nome; $('#u-nivel').textContent = NIVEL_LBL[Portal.nivel('faturamento', us)] || ''; };
  mostrar(u); Portal.aoAtualizarUsuario = us => { mostrar(us); S.ro = !Portal.podeEditar('faturamento', us); render(); };
  const t = location.hash.slice(1); if (TABS.includes(t)) S.tab = t;
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  await carregar();
})();
})();
</script>
</body>
